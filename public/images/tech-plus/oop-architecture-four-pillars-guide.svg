<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740">
  <defs>
    <style>
      .bg { fill: #070b14; }
      .card-bg { fill: #0d1527; stroke: #1e293b; stroke-width: 1.5; rx: 10px; }
      .inner-card { fill: #111c35; stroke: #25334d; stroke-width: 1; rx: 6px; }
      .text-title { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 26px; font-weight: 700; fill: #f8fafc; }
      .text-subtitle { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 14px; fill: #94a3b8; }
      .text-section { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
      .text-label { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 12px; fill: #94a3b8; }
      .text-val-mono { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 12px; fill: #e2e8f0; }
      .badge-text { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; text-anchor: middle; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="740" class="bg" />
  <rect x="15" y="15" width="1170" height="710" rx="14" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- Title Header -->
  <g transform="translate(45, 55)">
    <text class="text-title" x="0" y="0">Object-Oriented Programming (OOP) Architecture</text>
    <text class="text-subtitle" x="0" y="24">Class Blueprints, Heap Instantiation, and the Four Core Pillars (CompTIA Tech+ FC0-U71 4.3)</text>
    <rect x="0" y="38" width="1110" height="1" fill="#1e293b" />
  </g>

  <!-- Top Panel: Class Blueprint vs. Heap Object Instantiation (x=45, y=115, width=1110, height=205) -->
  <g transform="translate(45, 115)">
    <rect width="1110" height="205" class="card-bg" stroke="#0284c7" />
    <text class="text-section" x="20" y="24" fill="#38bdf8">1. The Blueprint (Class) vs. Concrete Memory Instance (Object)</text>
    <text class="text-label" x="840" y="24">FC0-U71 4.3: Attributes &amp; Methods</text>

    <!-- Blueprint Box -->
    <g transform="translate(20, 38)">
      <rect width="525" height="150" class="inner-card" stroke="#1e3a8a" />
      <rect x="12" y="10" width="180" height="22" rx="4" fill="#0c2340" />
      <text x="102" y="25" class="badge-text" fill="#38bdf8">CLASS (CODE BLUEPRINT)</text>
      <text x="205" y="25" class="text-label" fill="#93c5fd">Defines structure without holding live data</text>

      <rect x="12" y="38" width="501" height="98" rx="4" fill="#070b14" stroke="#1e293b" />
      <text x="22" y="58" class="text-val-mono" fill="#ec4899">class <tspan fill="#38bdf8" font-weight="700">NetworkSwitch</tspan>:</text>
      <text x="36" y="74" class="text-val-mono" fill="#94a3b8"><tspan fill="#64748b"># Attributes (State):</tspan> ip_address, port_count, is_online</text>
      <text x="36" y="90" class="text-val-mono" fill="#94a3b8"><tspan fill="#64748b"># Methods (Behavior):</tspan> reboot(), enable_poe(port), get_stats()</text>
      <text x="22" y="118" class="text-label" fill="#67e8f9">Technician Rule: A class takes no RAM until an object is instantiated!</text>
    </g>

    <!-- Instance Box -->
    <g transform="translate(565, 38)">
      <rect width="525" height="150" class="inner-card" stroke="#059669" />
      <rect x="12" y="10" width="185" height="22" rx="4" fill="#064e3b" />
      <text x="104" y="25" class="badge-text" fill="#34d399">OBJECT (HEAP INSTANCE)</text>
      <text x="210" y="25" class="text-label" fill="#6ee7b7">Allocated in dynamic RAM with live state</text>

      <rect x="12" y="38" width="501" height="98" rx="4" fill="#070b14" stroke="#1e293b" />
      <text x="22" y="58" class="text-val-mono" fill="#e2e8f0"><tspan fill="#10b981">sw1</tspan> = <tspan fill="#38bdf8">NetworkSwitch</tspan>(<tspan fill="#f59e0b">"10.0.1.1"</tspan>, <tspan fill="#f59e0b">48</tspan>)</text>
      <text x="22" y="76" class="text-val-mono" fill="#e2e8f0"><tspan fill="#10b981">sw1</tspan>.<tspan fill="#38bdf8">enable_poe</tspan>(<tspan fill="#f59e0b">1</tspan>)   <tspan fill="#64748b"># Dot notation invokes method</tspan></text>
      <text x="22" y="94" class="text-val-mono" fill="#94a3b8">RAM Address: <tspan fill="#a7f3d0">0x7FFE20A0</tspan> | State: <tspan fill="#cbd5e1">ip="10.0.1.1", ports=48</tspan></text>
      <text x="22" y="118" class="text-label" fill="#a7f3d0">Multiple unique objects (sw1, sw2) can be created from the same class.</text>
    </g>
  </g>

  <!-- Bottom Panel: The Four Pillars of OOP (x=45, y=335, width=1110, height=375) -->
  <g transform="translate(45, 335)">
    <rect width="1110" height="375" class="card-bg" stroke="#6366f1" />
    <text class="text-section" x="20" y="24" fill="#a5b4fc">2. The Four Pillars of Object-Oriented Software Design</text>
    <text class="text-label" x="800" y="24">Core Principles for Modular Enterprise Systems</text>

    <!-- Pillar 1: Encapsulation (Top Left) -->
    <g transform="translate(20, 36)">
      <rect width="525" height="152" class="inner-card" stroke="#f59e0b" />
      <rect x="12" y="10" width="165" height="22" rx="4" fill="#451a03" />
      <text x="94" y="25" class="badge-text" fill="#fcd34d">1. ENCAPSULATION</text>
      <text x="188" y="25" class="text-label" fill="#fef08a">Data Protection &amp; Access Control</text>

      <text x="14" y="52" class="text-label" fill="#cbd5e1"><tspan font-weight="700" fill="#fcd34d">Principle:</tspan> Bundle attributes and methods together; hide internal state</text>
      <text x="14" y="68" class="text-label" fill="#cbd5e1">behind private access modifiers to prevent unauthorized tampering.</text>

      <rect x="12" y="78" width="501" height="60" rx="4" fill="#070b14" stroke="#1e293b" />
      <text x="20" y="96" class="text-val-mono" font-size="11px" fill="#e2e8f0"><tspan fill="#ef4444">private</tspan> int _adminPin;  <tspan fill="#64748b">// Direct external access blocked</tspan></text>
      <text x="20" y="112" class="text-val-mono" font-size="11px" fill="#e2e8f0"><tspan fill="#10b981">public</tspan> void setPin(int pin) { if (pin &gt; 999) _adminPin = pin; }</text>
      <text x="20" y="128" class="text-label" font-size="11px" fill="#94a3b8">Public getters &amp; setters validate data before modifying state.</text>
    </g>

    <!-- Pillar 2: Abstraction (Top Right) -->
    <g transform="translate(565, 36)">
      <rect width="525" height="152" class="inner-card" stroke="#38bdf8" />
      <rect x="12" y="10" width="155" height="22" rx="4" fill="#0c2340" />
      <text x="89" y="25" class="badge-text" fill="#38bdf8">2. ABSTRACTION</text>
      <text x="178" y="25" class="text-label" fill="#bae6fd">Complexity Hiding via Interface</text>

      <text x="14" y="52" class="text-label" fill="#cbd5e1"><tspan font-weight="700" fill="#38bdf8">Principle:</tspan> Hide complicated internal low-level implementation details;</text>
      <text x="14" y="68" class="text-label" fill="#cbd5e1">expose only clean, intuitive interface methods to the developer.</text>

      <rect x="12" y="78" width="501" height="60" rx="4" fill="#070b14" stroke="#1e293b" />
      <text x="20" y="96" class="text-val-mono" font-size="11px" fill="#38bdf8">device.reboot();  <tspan fill="#64748b">// Clean, simple high-level interface call</tspan></text>
      <text x="20" y="112" class="text-label" font-size="11px" fill="#94a3b8">Hides 1,000 lines of complex ASIC flushing, EEPROM write, power rail</text>
      <text x="20" y="128" class="text-label" font-size="11px" fill="#94a3b8">cycling, and POST sequencing behind a single one-line method call.</text>
    </g>

    <!-- Pillar 3: Inheritance (Bottom Left) -->
    <g transform="translate(20, 202)">
      <rect width="525" height="158" class="inner-card" stroke="#10b981" />
      <rect x="12" y="10" width="155" height="22" rx="4" fill="#064e3b" />
      <text x="89" y="25" class="badge-text" fill="#34d399">3. INHERITANCE</text>
      <text x="178" y="25" class="text-label" fill="#a7f3d0">Code Reusability &amp; Hierarchy</text>

      <text x="14" y="52" class="text-label" fill="#cbd5e1"><tspan font-weight="700" fill="#34d399">Principle:</tspan> A child subclass automatically acquires (inherits) all attributes</text>
      <text x="14" y="68" class="text-label" fill="#cbd5e1">and methods from a parent superclass, eliminating duplicate logic.</text>

      <rect x="12" y="78" width="501" height="66" rx="4" fill="#070b14" stroke="#1e293b" />
      <text x="20" y="96" class="text-val-mono" font-size="11px" fill="#e2e8f0">class <tspan fill="#34d399">ManagedSwitch</tspan> <tspan fill="#ec4899">extends</tspan> <tspan fill="#38bdf8">NetworkSwitch</tspan>:</text>
      <text x="36" y="112" class="text-val-mono" font-size="11px" fill="#94a3b8">vlan_id = 100;  <tspan fill="#64748b">// Adds new specialized attribute</tspan></text>
      <text x="20" y="132" class="text-label" font-size="11px" fill="#6ee7b7">Automatically gets reboot(), ip_address, and port_count for free!</text>
    </g>

    <!-- Pillar 4: Polymorphism (Bottom Right) -->
    <g transform="translate(565, 202)">
      <rect width="525" height="158" class="inner-card" stroke="#c084fc" />
      <rect x="12" y="10" width="165" height="22" rx="4" fill="#2e1065" />
      <text x="94" y="25" class="badge-text" fill="#c084fc">4. POLYMORPHISM</text>
      <text x="188" y="25" class="text-label" fill="#ddd6fe">"Many Forms" - Dynamic Behavior</text>

      <text x="14" y="52" class="text-label" fill="#cbd5e1"><tspan font-weight="700" fill="#c084fc">Principle:</tspan> Subclasses provide their own specialized implementations of</text>
      <text x="14" y="68" class="text-label" fill="#cbd5e1">an inherited parent method while sharing the identical method name.</text>

      <rect x="12" y="78" width="501" height="66" rx="4" fill="#070b14" stroke="#1e293b" />
      <text x="20" y="96" class="text-val-mono" font-size="11px" fill="#e2e8f0"><tspan fill="#ec4899">for</tspan> device <tspan fill="#ec4899">in</tspan> [router, switch, firewall]:</text>
      <text x="36" y="112" class="text-val-mono" font-size="11px" fill="#e2e8f0">device.<tspan fill="#c084fc">run_diagnostic</tspan>()  <tspan fill="#64748b">// Executes customized version!</tspan></text>
      <text x="20" y="132" class="text-label" font-size="11px" fill="#ddd6fe">Common interface triggers distinct specialized logic for each object type.</text>
    </g>
  </g>
</svg>
