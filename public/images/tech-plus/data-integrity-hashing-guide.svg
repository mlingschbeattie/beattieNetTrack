<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740">
  <defs>
    <style>
      .bg { fill: #070b14; }
      .card-bg { fill: #0d1527; stroke: #1e293b; stroke-width: 1.5; rx: 10px; }
      .inner-card { fill: #111c35; stroke: #25334d; stroke-width: 1; rx: 6px; }
      .text-title { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 26px; font-weight: 700; fill: #f8fafc; }
      .text-subtitle { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 14px; fill: #94a3b8; }
      .text-section { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
      .text-label { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 12px; fill: #94a3b8; }
      .text-val-mono { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 11px; fill: #e2e8f0; }
      .badge-text { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; text-anchor: middle; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="740" class="bg" />
  <rect x="15" y="15" width="1170" height="710" rx="14" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- Title Header -->
  <g transform="translate(45, 55)">
    <text class="text-title" x="0" y="0">Cryptographic Hashing &amp; Data Integrity Architecture</text>
    <text class="text-subtitle" x="0" y="24">One-Way Mathematical Digests, The Avalanche Effect, and File Integrity Monitoring (FC0-U71 6.1)</text>
    <rect x="0" y="38" width="1110" height="1" fill="#1e293b" />
  </g>

  <!-- Top Panel: One-Way Hash & Avalanche Effect (x=45, y=115, width=1110, height=285) -->
  <g transform="translate(45, 115)">
    <rect width="1110" height="285" class="card-bg" stroke="#0284c7" />
    <text class="text-section" x="20" y="24" fill="#38bdf8">1. Mathematical Integrity: The One-Way Hash &amp; Avalanche Effect</text>
    <text class="text-label" text-anchor="end" x="1090" y="24">CompTIA Tech+ (FC0-U71) Objective 6.1</text>

    <!-- Left Box: Core Properties of Hashing (x=20, width=525) -->
    <g transform="translate(20, 36)">
      <rect width="525" height="232" class="inner-card" stroke="#1e3a8a" />
      <rect x="12" y="10" width="180" height="22" rx="4" fill="#0c2340" />
      <text x="102" y="25" class="badge-text" fill="#38bdf8">HASH PROPERTIES</text>
      <text x="202" y="25" class="text-label" fill="#93c5fd">Mathematical Guarantees</text>

      <rect x="12" y="38" width="501" height="180" rx="4" fill="#070b14" stroke="#1e293b" />
      <text x="18" y="58" class="text-val-mono" font-size="11px" font-weight="700" fill="#38bdf8">1. Deterministic Output:</text>
      <text x="18" y="74" class="text-label" font-size="10.5px" fill="#cbd5e1">The exact same input string ALWAYS produces the identical digest.</text>

      <text x="18" y="96" class="text-val-mono" font-size="11px" font-weight="700" fill="#34d399">2. Fixed Output Length:</text>
      <text x="18" y="112" class="text-label" font-size="10.5px" fill="#cbd5e1">Whether hashing 1 character or 100 GB, SHA-256 is always 256 bits (64 hex).</text>

      <text x="18" y="134" class="text-val-mono" font-size="11px" font-weight="700" fill="#fcd34d">3. One-Way (Pre-Image Resistance):</text>
      <text x="18" y="150" class="text-label" font-size="10.5px" fill="#cbd5e1">Computationally impossible to reverse a hash back to its source data.</text>

      <text x="18" y="172" class="text-val-mono" font-size="11px" font-weight="700" fill="#f87171">4. Collision Resistance:</text>
      <text x="18" y="188" class="text-label" font-size="10.5px" fill="#cbd5e1">Infeasible for two distinct inputs to produce the same digest.</text>

      <text x="18" y="206" class="text-val-mono" font-size="10px" fill="#94a3b8">Standards: SHA-256, SHA-3 (Secure) | MD5, SHA-1 (Broken / Deprecated)</text>
    </g>

    <!-- Right Box: Avalanche Effect Demonstration (x=565, width=525) -->
    <g transform="translate(565, 36)">
      <rect width="525" height="232" class="inner-card" stroke="#f59e0b" />
      <rect x="12" y="10" width="180" height="22" rx="4" fill="#451a03" />
      <text x="102" y="25" class="badge-text" fill="#fcd34d">AVALANCHE EFFECT</text>
      <text x="202" y="25" class="text-label" fill="#fde68a">Radical Output Divergence</text>

      <g transform="translate(12, 38)">
        <!-- Input 1 -->
        <rect width="501" height="66" rx="4" fill="#070b14" stroke="#1e293b" />
        <text x="14" y="20" class="text-val-mono" font-size="10.5px" fill="#93c5fd">INPUT 1: <tspan fill="#ffffff">"The quick brown fox jumps over the lazy dog."</tspan></text>
        <text x="14" y="38" class="text-label" font-size="10px" fill="#94a3b8">SHA-256 Digest:</text>
        <text x="14" y="54" class="text-val-mono" font-size="9.5px" fill="#34d399">ef537f25c895b7f73373364a621f429f042356cdd618b4007985b1c599aa0232</text>

        <!-- Input 2 -->
        <rect y="74" width="501" height="66" rx="4" fill="#070b14" stroke="#ef4444" />
        <text x="14" y="94" class="text-val-mono" font-size="10.5px" fill="#fca5a5">INPUT 2: <tspan fill="#ffffff">"The quick brown fox jumps over the lazy dog</tspan><tspan fill="#ef4444" font-weight="700">!"</tspan></text>
        <text x="14" y="112" class="text-label" font-size="10px" fill="#94a3b8">SHA-256 Digest (Single punctuation mark changed):</text>
        <text x="14" y="128" class="text-val-mono" font-size="9.5px" fill="#f87171">532eaabd9574880dbf76b9b8cc00832c20a6ec113d682299550d7a6e0f345e25</text>
      </g>

      <text x="14" y="196" class="text-label" font-size="10.5px" fill="#cbd5e1"><tspan font-weight="700" fill="#fcd34d">Takeaway:</tspan> Modifying a single bit changes &gt;50% of the digest output.</text>
      <text x="14" y="214" class="text-label" font-size="10.5px" fill="#cbd5e1">Any unauthorized tampering or silent file corruption is immediately obvious.</text>
    </g>
  </g>

  <!-- Bottom Panel: File Integrity Monitoring & Hashing vs Encryption (x=45, y=415, width=1110, height=300) -->
  <g transform="translate(45, 415)">
    <rect width="1110" height="300" class="card-bg" stroke="#10b981" />
    <text class="text-section" x="20" y="24" fill="#34d399">2. Production Verification: File Integrity Monitoring (FIM) &amp; Exam Trap</text>
    <text class="text-label" text-anchor="end" x="1090" y="24">Production Auditing &amp; Triage</text>

    <!-- Left Box: File Integrity Monitoring (x=20, width=525) -->
    <g transform="translate(20, 36)">
      <rect width="525" height="245" class="inner-card" stroke="#059669" />
      <rect x="12" y="10" width="220" height="22" rx="4" fill="#064e3b" />
      <text x="122" y="25" class="badge-text" fill="#34d399">FILE INTEGRITY MONITORING</text>
      <text x="245" y="25" class="text-label" fill="#6ee7b7">Checksum Triage</text>

      <rect x="12" y="38" width="501" height="88" rx="4" fill="#070b14" stroke="#1e293b" />
      <text x="18" y="58" class="text-val-mono" font-size="11px" font-weight="700" fill="#38bdf8">Software Download Verification:</text>
      <text x="18" y="74" class="text-label" font-size="10.5px" fill="#cbd5e1">1. Publisher posts SHA-256 digest on their official HTTPS portal.</text>
      <text x="18" y="92" class="text-label" font-size="10.5px" fill="#cbd5e1">2. Technician downloads the installer binary or OS image.</text>
      <text x="18" y="110" class="text-label" font-size="10.5px" fill="#cbd5e1">3. PowerShell: <tspan fill="#34d399">Get-FileHash -Algorithm SHA256 ./setup.exe</tspan></text>

      <rect x="12" y="132" width="501" height="96" rx="4" fill="#0c2340" stroke="#0284c7" />
      <text x="18" y="152" class="text-val-mono" font-size="11px" font-weight="700" fill="#38bdf8">Enterprise Host FIM (Tripwire / Wazuh):</text>
      <text x="18" y="170" class="text-label" font-size="10.5px" fill="#cbd5e1">• Monitors critical OS files: /etc/shadow, system32/drivers.</text>
      <text x="18" y="188" class="text-label" font-size="10.5px" fill="#cbd5e1">• Hashes files on a schedule; compares against known good baselines.</text>
      <text x="18" y="206" class="text-val-mono" font-size="10px" fill="#67e8f9">Alerts SOC immediately if malware replaces a core system DLL.</text>
    </g>

    <!-- Right Box: Hashing vs Encryption (x=565, width=525) -->
    <g transform="translate(565, 36)">
      <rect width="525" height="245" class="inner-card" stroke="#6366f1" />
      <rect x="12" y="10" width="220" height="22" rx="4" fill="#1e1b4b" />
      <text x="122" y="25" class="badge-text" fill="#a5b4fc">THE COMPTIA EXAM TRAP</text>
      <text x="245" y="25" class="text-label" fill="#c7d2fe">Hashing vs. Encryption</text>

      <rect x="12" y="38" width="501" height="92" rx="4" fill="#070b14" stroke="#1e293b" />
      <text x="18" y="58" class="text-val-mono" font-size="11px" font-weight="700" fill="#38bdf8">ENCRYPTION: Two-Way Reversible</text>
      <text x="18" y="76" class="text-label" font-size="10.5px" fill="#cbd5e1">• Purpose: <tspan font-weight="700" fill="#38bdf8">CONFIDENTIALITY</tspan> (Hiding data from snooping eyes).</text>
      <text x="18" y="94" class="text-label" font-size="10.5px" fill="#cbd5e1">• Requires a cryptographic key to decrypt back to plaintext.</text>
      <text x="18" y="112" class="text-label" font-size="10.5px" fill="#cbd5e1">• Examples: AES-256, RSA, BitLocker, HTTPS / TLS.</text>

      <rect x="12" y="136" width="501" height="92" rx="4" fill="#1e1b4b" stroke="#ef4444" />
      <text x="18" y="156" class="text-val-mono" font-size="11px" font-weight="700" fill="#f87171">HASHING: One-Way Irreversible</text>
      <text x="18" y="174" class="text-label" font-size="10.5px" fill="#cbd5e1">• Purpose: <tspan font-weight="700" fill="#f87171">INTEGRITY</tspan> (Verifying data hasn't been altered).</text>
      <text x="18" y="192" class="text-label" font-size="10.5px" fill="#cbd5e1">• You CANNOT "decrypt" a hash; there is no key.</text>
      <text x="18" y="210" class="text-label" font-size="10.5px" fill="#fca5a5">Technician Rule: Hashes verify integrity; encryption shields secrecy.</text>
    </g>
  </g>
</svg>
