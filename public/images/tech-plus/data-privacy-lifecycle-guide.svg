<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740">
  <defs>
    <style>
      .bg { fill: #070b14; }
      .card-bg { fill: #0d1527; stroke: #1e293b; stroke-width: 1.5; rx: 12px; }
      .inner-card { fill: #111c35; stroke: #25334d; stroke-width: 1.5; rx: 8px; }
      .text-title { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 26px; font-weight: 700; fill: #f8fafc; }
      .text-subtitle { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 15px; fill: #94a3b8; }
      .text-section { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 14px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
      .text-label { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
      .text-val-mono { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 13px; fill: #e2e8f0; }
      .badge-text { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; text-anchor: middle; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="740" class="bg" />
  <rect x="15" y="15" width="1170" height="710" rx="14" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- Title Header -->
  <g transform="translate(45, 55)">
    <text class="text-title" x="0" y="0">Data Classification &amp; Privacy Concepts</text>
    <text class="text-subtitle" x="0" y="24">Sensitivity Tiers, Anonymization, and Privacy Rights (CompTIA Tech+ FC0-U71)</text>
    <rect x="0" y="38" width="1110" height="1" fill="#1e293b" />
  </g>

  <!-- Top Panel: The 4 Data Classification Tiers (x=45, y=115, width=1110, height=310) -->
  <g transform="translate(45, 115)">
    <rect width="1110" height="310" class="card-bg" stroke="#0284c7" />
    <text class="text-section" x="24" y="28" fill="#38bdf8">1. Enterprise Data Classification: How Sensitive Is the Information?</text>
    <text class="text-label" text-anchor="end" x="1086" y="28">Sensitivity Ranking</text>

    <!-- 4 Horizontal Classification Banners -->
    <g transform="translate(24, 46)">
      <!-- Tier 1: RESTRICTED -->
      <g transform="translate(0, 0)">
        <rect width="1062" height="54" rx="6" fill="#111c35" stroke="#ef4444" stroke-width="1.5" />
        <rect x="12" y="10" width="140" height="34" rx="4" fill="#dc2626" />
        <text x="82" y="32" class="badge-text" font-size="13px" fill="#ffffff">RESTRICTED</text>
        <text x="175" y="33" class="badge-text" font-size="12px" fill="#f87171">HIGHEST SENSITIVITY:</text>
        <text x="330" y="33" class="text-val-mono" font-size="12px" fill="#ffffff">SSNs, Passwords, Biometrics, Encryption Keys</text>
        <rect x="910" y="12" width="140" height="30" rx="4" fill="#450a0a" stroke="#ef4444" />
        <text x="980" y="31" class="badge-text" font-size="10.5px" fill="#fca5a5">MFA + Hardware Token</text>
      </g>

      <!-- Tier 2: CONFIDENTIAL -->
      <g transform="translate(0, 62)">
        <rect width="1062" height="54" rx="6" fill="#111c35" stroke="#f59e0b" stroke-width="1.5" />
        <rect x="12" y="10" width="140" height="34" rx="4" fill="#d97706" />
        <text x="82" y="32" class="badge-text" font-size="13px" fill="#ffffff">CONFIDENTIAL</text>
        <text x="175" y="33" class="badge-text" font-size="12px" fill="#fcd34d">BUSINESS PRIVATE:</text>
        <text x="325" y="33" class="text-val-mono" font-size="12px" fill="#ffffff">Salaries, Student Records, Financial Audits, Client Lists</text>
        <rect x="910" y="12" width="140" height="30" rx="4" fill="#451a03" stroke="#f59e0b" />
        <text x="980" y="31" class="badge-text" font-size="10.5px" fill="#fde68a">Authorized Staff Only</text>
      </g>

      <!-- Tier 3: INTERNAL -->
      <g transform="translate(0, 124)">
        <rect width="1062" height="54" rx="6" fill="#111c35" stroke="#38bdf8" stroke-width="1.5" />
        <rect x="12" y="10" width="140" height="34" rx="4" fill="#0284c7" />
        <text x="82" y="32" class="badge-text" font-size="13px" fill="#ffffff">INTERNAL</text>
        <text x="175" y="33" class="badge-text" font-size="12px" fill="#38bdf8">OPERATIONAL:</text>
        <text x="290" y="33" class="text-val-mono" font-size="12px" fill="#ffffff">Internal Wiki, Staff Directory, Meeting Notes, Memos</text>
        <rect x="910" y="12" width="140" height="30" rx="4" fill="#0c2340" stroke="#38bdf8" />
        <text x="980" y="31" class="badge-text" font-size="10.5px" fill="#93c5fd">All Company Employees</text>
      </g>

      <!-- Tier 4: PUBLIC -->
      <g transform="translate(0, 186)">
        <rect width="1062" height="54" rx="6" fill="#111c35" stroke="#10b981" stroke-width="1.5" />
        <rect x="12" y="10" width="140" height="34" rx="4" fill="#059669" />
        <text x="82" y="32" class="badge-text" font-size="13px" fill="#ffffff">PUBLIC</text>
        <text x="175" y="33" class="badge-text" font-size="12px" fill="#34d399">UNRESTRICTED:</text>
        <text x="300" y="33" class="text-val-mono" font-size="12px" fill="#ffffff">Marketing Brochures, Course Catalog, Press Releases</text>
        <rect x="910" y="12" width="140" height="30" rx="4" fill="#064e3b" stroke="#10b981" />
        <text x="980" y="31" class="badge-text" font-size="10.5px" fill="#a7f3d0">Open to the Public</text>
      </g>
    </g>
  </g>

  <!-- Bottom Panel: Privacy Engineering & Privacy Rights (x=45, y=445, width=1110, height=270) -->
  <g transform="translate(45, 445)">
    <rect width="1110" height="270" class="card-bg" stroke="#8b5cf6" />
    <text class="text-section" x="24" y="28" fill="#c084fc">2. Protecting Personal Privacy: Sanitization &amp; Student/User Rights</text>
    <text class="text-label" text-anchor="end" x="1086" y="28">Privacy Laws (GDPR &amp; HIPAA)</text>

    <!-- Left Box: Anonymization vs Pseudonymization -->
    <g transform="translate(24, 46)">
      <rect width="520" height="202" class="inner-card" stroke="#38bdf8" />
      <rect x="14" y="12" width="220" height="24" rx="4" fill="#0c2340" />
      <text x="124" y="29" class="badge-text" font-size="12px" fill="#38bdf8">MASKING &amp; PRIVACY TECH</text>

      <!-- Anonymization Example -->
      <g transform="translate(14, 46)">
        <rect width="492" height="66" rx="6" fill="#070b14" stroke="#10b981" />
        <text x="14" y="24" class="badge-text" font-size="12px" fill="#34d399">ANONYMIZATION (Permanent / Irreversible):</text>
        <text x="14" y="46" class="text-val-mono" font-size="12px" fill="#cbd5e1">"Alice Smith, Age 16" ➔ <tspan fill="#34d399">"[REDACTED], Age 15-18"</tspan></text>
      </g>

      <!-- Pseudonymization Example -->
      <g transform="translate(14, 122)">
        <rect width="492" height="66" rx="6" fill="#070b14" stroke="#f59e0b" />
        <text x="14" y="24" class="badge-text" font-size="12px" fill="#fcd34d">PSEUDONYMIZATION (Reversible with Secret Key):</text>
        <text x="14" y="46" class="text-val-mono" font-size="12px" fill="#cbd5e1">"Alice Smith" ➔ <tspan fill="#fcd34d">"STUDENT_ID_9482"</tspan> (Key held in vault)</text>
      </g>
    </g>

    <!-- Right Box: Data Subject Rights -->
    <g transform="translate(566, 46)">
      <rect width="520" height="202" class="inner-card" stroke="#10b981" />
      <rect x="14" y="12" width="200" height="24" rx="4" fill="#064e3b" />
      <text x="114" y="29" class="badge-text" font-size="12px" fill="#34d399">YOUR PRIVACY RIGHTS</text>

      <!-- 4 Visual Right Badges -->
      <g transform="translate(14, 46)">
        <rect x="0" y="0" width="238" height="66" rx="6" fill="#070b14" stroke="#38bdf8" />
        <text x="16" y="26" class="badge-text" font-size="12px" fill="#38bdf8">1. RIGHT TO SEE (ACCESS)</text>
        <text x="16" y="48" class="text-label" font-size="11px" fill="#cbd5e1">Request a copy of your records</text>

        <rect x="254" y="0" width="238" height="66" rx="6" fill="#070b14" stroke="#10b981" />
        <text x="270" y="26" class="badge-text" font-size="12px" fill="#34d399">2. RIGHT TO FIX (RECTIFY)</text>
        <text x="270" y="48" class="text-label" font-size="11px" fill="#cbd5e1">Correct wrong or outdated data</text>

        <rect x="0" y="76" width="238" height="66" rx="6" fill="#070b14" stroke="#ef4444" />
        <text x="16" y="102" class="badge-text" font-size="12px" fill="#f87171">3. RIGHT TO DELETE (ERASE)</text>
        <text x="16" y="124" class="text-label" font-size="11px" fill="#cbd5e1">Demand data wipe ("Forget me")</text>

        <rect x="254" y="76" width="238" height="66" rx="6" fill="#070b14" stroke="#c084fc" />
        <text x="270" y="102" class="badge-text" font-size="12px" fill="#c084fc">4. RIGHT TO EXPORT</text>
        <text x="270" y="124" class="text-label" font-size="11px" fill="#cbd5e1">Download files in standard format</text>
      </g>
    </g>
  </g>
</svg>
