<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <defs>
    <style>
      .bg { fill: #070b14; }
      .card-bg { fill: #0d1527; stroke: #1e293b; stroke-width: 1.5; rx: 10px; }
      .inner-card { fill: #111c35; stroke: #25334d; stroke-width: 1; rx: 6px; }
      .text-title { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 26px; font-weight: 700; fill: #f8fafc; }
      .text-subtitle { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 14px; fill: #94a3b8; }
      .text-section { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 13px; font-weight: 700; fill: #38bdf8; letter-spacing: 0.08em; text-transform: uppercase; }
      .text-label { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 12px; fill: #94a3b8; }
      .text-val-mono { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 13px; fill: #e2e8f0; }
      .th-mono { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; fill: #38bdf8; }
      .td-mono { font-family: 'JetBrains Mono', monospace; font-size: 12px; fill: #cbd5e1; }
    </style>
  </defs>

  <rect width="1200" height="700" class="bg" />
  <rect x="15" y="15" width="1170" height="670" rx="14" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- Title Header -->
  <g transform="translate(45, 55)">
    <text class="text-title" x="0" y="0">Storage Capacity Units &amp; Binary vs. Decimal Scale</text>
    <text class="text-subtitle" x="0" y="24">SI Decimal (Base-10) vs. IEC Binary (Base-2) and the Operating System Capacity Discrepancy</text>
    <rect x="0" y="38" width="1110" height="1" fill="#1e293b" />
  </g>

  <!-- Panel 1: Hierarchy Comparison Table -->
  <g transform="translate(45, 115)">
    <rect width="1110" height="255" class="card-bg" />
    <text class="text-section" x="20" y="26">1. Storage Capacity Hierarchy Comparison</text>
    <text class="text-label" x="830" y="26">CompTIA FC0-U71 Core Objective 1.3</text>

    <!-- Table -->
    <g transform="translate(20, 42)">
      <!-- Table Header -->
      <rect x="0" y="0" width="1070" height="30" fill="#152038" rx="4" />
      <text x="15" y="20" class="th-mono">Prefix Unit</text>
      <text x="135" y="20" class="th-mono">Decimal (SI)</text>
      <text x="290" y="20" class="th-mono">Exact Decimal Bytes</text>
      <text x="470" y="20" class="th-mono">Binary (IEC)</text>
      <text x="635" y="20" class="th-mono">Exact Binary Bytes</text>
      <text x="825" y="20" class="th-mono">Primary Real-World Use</text>

      <!-- Row 1: Kilo -->
      <rect x="0" y="34" width="1070" height="28" fill="#0d172a" rx="3" />
      <text x="15" y="53" class="td-mono" font-weight="700" fill="#38bdf8">Kilo- (K / Ki)</text>
      <text x="135" y="53" class="td-mono">1 KB = 10³ Bytes</text>
      <text x="290" y="53" class="td-mono">1,000</text>
      <text x="470" y="53" class="td-mono" fill="#34d399">1 KiB = 2¹⁰ Bytes</text>
      <text x="635" y="53" class="td-mono" fill="#34d399">1,024</text>
      <text x="825" y="53" class="td-mono">Text files, small configs</text>

      <!-- Row 2: Mega -->
      <rect x="0" y="66" width="1070" height="28" fill="#111f38" rx="3" />
      <text x="15" y="85" class="td-mono" font-weight="700" fill="#38bdf8">Mega- (M / Mi)</text>
      <text x="135" y="85" class="td-mono">1 MB = 10⁶ Bytes</text>
      <text x="290" y="85" class="td-mono">1,000,000</text>
      <text x="470" y="85" class="td-mono" fill="#34d399">1 MiB = 2²⁰ Bytes</text>
      <text x="635" y="85" class="td-mono" fill="#34d399">1,048,576</text>
      <text x="825" y="85" class="td-mono">MP3s, photos, RAM buffers</text>

      <!-- Row 3: Giga -->
      <rect x="0" y="98" width="1070" height="28" fill="#0d172a" rx="3" />
      <text x="15" y="117" class="td-mono" font-weight="700" fill="#38bdf8">Giga- (G / Gi)</text>
      <text x="135" y="117" class="td-mono">1 GB = 10⁹ Bytes</text>
      <text x="290" y="117" class="td-mono">1,000,000,000</text>
      <text x="470" y="117" class="td-mono" fill="#34d399">1 GiB = 2³⁰ Bytes</text>
      <text x="635" y="117" class="td-mono" fill="#34d399">1,073,741,824</text>
      <text x="825" y="117" class="td-mono">RAM capacity, video files</text>

      <!-- Row 4: Tera -->
      <rect x="0" y="130" width="1070" height="28" fill="#111f38" rx="3" />
      <text x="15" y="149" class="td-mono" font-weight="700" fill="#38bdf8">Tera- (T / Ti)</text>
      <text x="135" y="149" class="td-mono">1 TB = 10¹² Bytes</text>
      <text x="290" y="149" class="td-mono">1,000,000,000,000</text>
      <text x="470" y="149" class="td-mono" fill="#34d399">1 TiB = 2⁴⁰ Bytes</text>
      <text x="635" y="149" class="td-mono" fill="#34d399">1,099,511,627,776</text>
      <text x="825" y="149" class="td-mono">Modern SSD / HDD drives</text>

      <!-- Row 5: Peta -->
      <rect x="0" y="162" width="1070" height="28" fill="#0d172a" rx="3" />
      <text x="15" y="181" class="td-mono" font-weight="700" fill="#38bdf8">Peta- (P / Pi)</text>
      <text x="135" y="181" class="td-mono">1 PB = 10¹⁵ Bytes</text>
      <text x="290" y="181" class="td-mono">1,000,000,000,000,000</text>
      <text x="470" y="181" class="td-mono" fill="#34d399">1 PiB = 2⁵⁰ Bytes</text>
      <text x="635" y="181" class="td-mono" fill="#34d399">1,125,899,906,842,624</text>
      <text x="825" y="181" class="td-mono">Data center SAN / NAS arrays</text>
    </g>
  </g>

  <!-- Panel 2: The "Missing Space" Math Breakdown -->
  <g transform="translate(45, 390)">
    <rect width="540" height="260" class="card-bg" />
    <text class="text-section" x="20" y="28">2. Why a 1 TB SSD Shows as 931 GB in Windows</text>

    <g transform="translate(20, 48)">
      <!-- Manufacturer Box -->
      <rect width="500" height="58" class="inner-card" />
      <text x="15" y="22" class="text-val-mono" font-weight="700" fill="#38bdf8">Manufacturer Retail Packaging (Base-10):</text>
      <text x="15" y="44" class="text-val-mono" fill="#cbd5e1">1 TB = 1,000,000,000,000 bytes (1 Trillion bytes)</text>

      <!-- Conversion Equation -->
      <rect y="70" width="500" height="66" fill="#0d1f38" stroke="#1d4ed8" rx="6" />
      <text x="15" y="93" class="text-val-mono" font-weight="700" fill="#93c5fd">Windows Binary Calculation (Base-2):</text>
      <text x="15" y="118" font-family="'JetBrains Mono', monospace" font-size="14px" font-weight="700" fill="#60a5fa">
        1,000,000,000,000 ÷ 1,073,741,824 = <tspan fill="#34d399">931.32 GiB</tspan>
      </text>

      <!-- Diagnostic note -->
      <text x="15" y="160" class="text-label" fill="#94a3b8">
        Windows calculates in binary (<tspan fill="#34d399" font-family="monospace">GiB</tspan>) but labels the column as <tspan fill="#f43f5e" font-family="monospace">"GB"</tspan>.
      </text>
      <text x="15" y="180" class="text-label" fill="#64748b">
        No disk space was lost or stolen; it is purely a measurement unit labeling mismatch.
      </text>
    </g>
  </g>

  <!-- Panel 3: Bits vs Bytes (b vs B) -->
  <g transform="translate(615, 390)">
    <rect width="540" height="260" class="card-bg" />
    <text class="text-section" x="20" y="28">3. Bits vs. Bytes: The Technician's Cardinal Rule</text>

    <g transform="translate(20, 48)">
      <!-- Lowercase b -->
      <rect width="500" height="82" class="inner-card" />
      <text x="15" y="24" class="text-val-mono" font-weight="700" fill="#fbbf24">Lowercase 'b' = Bits (Transfer Rates &amp; Bandwidth)</text>
      <text x="15" y="48" class="text-val-mono" font-size="12px" fill="#cbd5e1">Examples: 100 Mbps Ethernet, 1 Gbps Internet Connection</text>
      <text x="15" y="68" class="text-label" fill="#94a3b8">Measures how many binary pulses pass a wire per second.</text>

      <!-- Uppercase B -->
      <rect y="94" width="500" height="82" class="inner-card" />
      <text x="15" y="118" class="text-val-mono" font-weight="700" fill="#34d399">Uppercase 'B' = Bytes (Storage Capacity &amp; File Size)</text>
      <text x="15" y="142" class="text-val-mono" font-size="12px" fill="#cbd5e1">Examples: 500 MB File, 16 GB RAM, 2 TB SSD Drive</text>
      <text x="15" y="162" class="text-label" fill="#94a3b8">Measures physical clusters/cells reserved in storage memory.</text>
    </g>
  </g>
</svg>
