<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740">
  <defs>
    <style>
      .bg { fill: #070b14; }
      .card-bg { fill: #0d1527; stroke: #1e293b; stroke-width: 1.5; rx: 10px; }
      .inner-card { fill: #111c35; stroke: #25334d; stroke-width: 1; rx: 6px; }
      .text-title { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 26px; font-weight: 700; fill: #f8fafc; }
      .text-subtitle { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 14px; fill: #94a3b8; }
      .text-section { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
      .text-label { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 12px; fill: #94a3b8; }
      .text-val-mono { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 12px; fill: #e2e8f0; }
      .badge-text { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; text-anchor: middle; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="740" class="bg" />
  <rect x="15" y="15" width="1170" height="710" rx="14" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- Title Header -->
  <g transform="translate(45, 55)">
    <text class="text-title" x="0" y="0">Password Security, Mathematical Entropy &amp; NIST Guidelines</text>
    <text class="text-subtitle" x="0" y="24">Entropy Math (E = L × log₂ R), Passphrase Architecture, Attack Taxonomy, and Salted Hashes (FC0-U71 6.3)</text>
    <rect x="0" y="38" width="1110" height="1" fill="#1e293b" />
  </g>

  <!-- Top Panel: Entropy Math & Attack Taxonomy (x=45, y=115, width=1110, height=270) -->
  <g transform="translate(45, 115)">
    <rect width="1110" height="270" class="card-bg" stroke="#0284c7" />
    <text class="text-section" x="20" y="24" fill="#38bdf8">1. Mathematical Entropy: Length Trumps Complexity (NIST SP 800-63B)</text>
    <text class="text-label" x="830" y="24">CompTIA Tech+ (FC0-U71) Objective 6.3</text>

    <!-- Left Box: Entropy Comparison (x=20, width=525) -->
    <g transform="translate(20, 36)">
      <rect width="525" height="218" class="inner-card" stroke="#1e3a8a" />
      <rect x="12" y="10" width="220" height="22" rx="4" fill="#0c2340" />
      <text x="122" y="25" class="badge-text" fill="#38bdf8">ENTROPY: E = L × log₂(R)</text>
      <text x="245" y="25" class="text-label" fill="#93c5fd">L = Length, R = Character Pool Size</text>

      <!-- Comparison 1: Short Complex -->
      <g transform="translate(12, 38)">
        <rect width="501" height="52" rx="4" fill="#1e1b4b" stroke="#ef4444" />
        <rect x="8" y="12" width="60" height="26" rx="3" fill="#dc2626" />
        <text x="38" y="29" class="badge-text" fill="#ffffff">WEAK</text>
        <text x="80" y="24" class="text-val-mono" font-size="11px" fill="#f87171">Short Complex: "Tr0ub4dor&amp;3" (10 chars, ~44 bits entropy)</text>
        <text x="80" y="42" class="text-label" font-size="10px" fill="#cbd5e1">Hard for humans to memorize; cracked in days by modern RTX 4090 GPU clusters.</text>
      </g>

      <!-- Comparison 2: Long Passphrase -->
      <g transform="translate(12, 96)">
        <rect width="501" height="52" rx="4" fill="#064e3b" stroke="#059669" />
        <rect x="8" y="12" width="60" height="26" rx="3" fill="#059669" />
        <text x="38" y="29" class="badge-text" fill="#ffffff">SECURE</text>
        <text x="80" y="24" class="text-val-mono" font-size="11px" fill="#34d399">Diceware Passphrase: "correct-horse-battery-staple" (28 chars, ~77 bits)</text>
        <text x="80" y="42" class="text-label" font-size="10px" fill="#cbd5e1">Easy for humans to memorize; requires millions of years to crack mathematically.</text>
      </g>

      <text x="14" y="174" class="text-label" font-size="11px" fill="#cbd5e1"><tspan font-weight="700" fill="#38bdf8">NIST Rule:</tspan> Adding 1 character of length increases search space exponentially</text>
      <text x="14" y="190" class="text-label" font-size="11px" fill="#cbd5e1">far more than replacing an 'a' with an '@'. Minimum recommended length is 15+ chars.</text>
      <text x="14" y="206" class="text-label" font-size="11px" fill="#93c5fd">Technician Takeaway: Prioritize Passphrase Length over Symbol Gymnastics!</text>
    </g>

    <!-- Right Box: Attack Taxonomy (x=565, width=525) -->
    <g transform="translate(565, 36)">
      <rect width="525" height="218" class="inner-card" stroke="#f59e0b" />
      <rect x="12" y="10" width="180" height="22" rx="4" fill="#451a03" />
      <text x="102" y="25" class="badge-text" fill="#fcd34d">ATTACK TAXONOMY</text>
      <text x="202" y="25" class="text-label" fill="#fde68a">How Passwords Are Targeted</text>

      <g transform="translate(12, 38)">
        <!-- Attack 1: Brute Force -->
        <rect x="0" y="0" width="501" height="38" rx="4" fill="#070b14" stroke="#1e293b" />
        <text x="12" y="24" class="text-val-mono" font-size="11px" font-weight="700" fill="#f87171">Brute-Force:</text>
        <text x="105" y="24" class="text-label" font-size="11px" fill="#cbd5e1">GPU rigs mathematically testing every combination (a, b... z, 0... !)</text>

        <!-- Attack 2: Dictionary -->
        <rect x="0" y="42" width="501" height="38" rx="4" fill="#070b14" stroke="#1e293b" />
        <text x="12" y="66" class="text-val-mono" font-size="11px" font-weight="700" fill="#fcd34d">Dictionary:</text>
        <text x="105" y="66" class="text-label" font-size="11px" fill="#cbd5e1">Iterating through wordlists of leaked passwords (e.g. RockYou.txt)</text>

        <!-- Attack 3: Credential Stuffing -->
        <rect x="0" y="84" width="501" height="38" rx="4" fill="#070b14" stroke="#1e293b" />
        <text x="12" y="108" class="text-val-mono" font-size="11px" font-weight="700" fill="#38bdf8">Stuffing:</text>
        <text x="105" y="108" class="text-label" font-size="11px" fill="#cbd5e1">Automated bots testing stolen email/password combos from past breaches</text>

        <!-- Attack 4: Password Spray -->
        <rect x="0" y="126" width="501" height="38" rx="4" fill="#070b14" stroke="#1e293b" />
        <text x="12" y="150" class="text-val-mono" font-size="11px" font-weight="700" fill="#c084fc">Spray:</text>
        <text x="105" y="150" class="text-label" font-size="11px" fill="#cbd5e1">Testing 1 common password (Winter2026!) against 10,000 accounts to avoid lockouts</text>
      </g>
    </g>
  </g>

  <!-- Bottom Panel: Enterprise Defenses: Managers, Salted Hashes, NIST (x=45, y=400, width=1110, height=315) -->
  <g transform="translate(45, 400)">
    <rect width="1110" height="315" class="card-bg" stroke="#10b981" />
    <text class="text-section" x="20" y="24" fill="#34d399">2. Enterprise Defenses: Password Managers, Cryptographic Salting, and NIST Rules</text>
    <text class="text-label" x="800" y="24">Production Identity Hardening</text>

    <!-- Left Box: Managers & Salting (x=20, width=525) -->
    <g transform="translate(20, 36)">
      <rect width="525" height="258" class="inner-card" stroke="#059669" />
      <rect x="12" y="10" width="220" height="22" rx="4" fill="#064e3b" />
      <text x="122" y="25" class="badge-text" fill="#34d399">ENTERPRISE PASSWORD MANAGERS</text>
      <text x="245" y="25" class="text-label" fill="#6ee7b7">Zero-Knowledge Encrypted Vault</text>

      <rect x="12" y="38" width="501" height="88" rx="4" fill="#070b14" stroke="#1e293b" />
      <text x="20" y="58" class="text-val-mono" font-size="11px" font-weight="700" fill="#38bdf8">How Password Managers Secure Users:</text>
      <text x="20" y="76" class="text-label" fill="#cbd5e1">• Generates unique, 24+ character random passwords for every website.</text>
      <text x="20" y="94" class="text-label" fill="#cbd5e1">• Eliminates password reuse: A breach at Site A never compromises Site B.</text>
      <text x="20" y="112" class="text-label" fill="#34d399">• Zero-Knowledge Encryption: Master key never leaves the client unencrypted.</text>

      <rect x="12" y="132" width="501" height="110" rx="4" fill="#0c2340" stroke="#0284c7" />
      <text x="20" y="152" class="text-val-mono" font-size="11px" font-weight="700" fill="#38bdf8">Server-Side Storage: Hashing &amp; Cryptographic Salt:</text>
      <text x="20" y="170" class="text-label" font-size="11px" fill="#cbd5e1">• Servers NEVER store plaintext passwords! They store a one-way hash.</text>
      <text x="20" y="188" class="text-val-mono" font-size="11px" fill="#e2e8f0">Stored = <tspan fill="#ec4899">Argon2id</tspan>(<tspan fill="#f59e0b">Password</tspan> + <tspan fill="#38bdf8">RandomSalt</tspan>)</text>
      <text x="20" y="206" class="text-label" font-size="11px" fill="#cbd5e1">• The Salt (unique random string) completely defeats precomputed Rainbow Tables!</text>
      <text x="20" y="224" class="text-label" font-size="11px" fill="#67e8f9">Even if two users have the same password, their salted hashes look completely different.</text>
    </g>

    <!-- Right Box: NIST SP 800-63B Rules (x=565, width=525) -->
    <g transform="translate(565, 36)">
      <rect width="525" height="258" class="inner-card" stroke="#6366f1" />
      <rect x="12" y="10" width="220" height="22" rx="4" fill="#1e1b4b" />
      <text x="122" y="25" class="badge-text" fill="#a5b4fc">NIST SP 800-63B STANDARDS</text>
      <text x="245" y="25" class="text-label" fill="#c7d2fe">Modern Guidelines vs Legacy Rules</text>

      <g transform="translate(12, 38)">
        <rect width="501" height="48" rx="4" fill="#070b14" stroke="#1e293b" />
        <text x="14" y="20" class="text-val-mono" font-size="11px" font-weight="700" fill="#f87171">RETIRED: Mandatory 90-Day Rotation</text>
        <text x="14" y="38" class="text-label" font-size="10px" fill="#cbd5e1">Forces users to make predictable micro-changes (Spring2026! ➔ Summer2026!). Rotate ONLY upon breach.</text>

        <rect y="54" width="501" height="48" rx="4" fill="#070b14" stroke="#1e293b" />
        <text x="14" y="74" class="text-val-mono" font-size="11px" font-weight="700" fill="#34d399">ENFORCE: 15+ Character Minimum Length</text>
        <text x="14" y="92" class="text-label" font-size="10px" fill="#cbd5e1">Encourage passphrases with natural word boundaries rather than frustrating symbol requirements.</text>

        <rect y="108" width="501" height="48" rx="4" fill="#070b14" stroke="#1e293b" />
        <text x="14" y="128" class="text-val-mono" font-size="11px" font-weight="700" fill="#38bdf8">ENFORCE: Screening Against Breached Wordlists</text>
        <text x="14" y="146" class="text-label" font-size="10px" fill="#cbd5e1">Automatically check new passwords against known dictionaries (HaveIBeenPwned API) at creation.</text>

        <rect y="162" width="501" height="48" rx="4" fill="#070b14" stroke="#1e293b" />
        <text x="14" y="182" class="text-val-mono" font-size="11px" font-weight="700" fill="#fcd34d">DEPLOY: FIDO2 Passkeys for Perimeter SSO</text>
        <text x="14" y="200" class="text-label" font-size="10px" fill="#cbd5e1">Phishing-resistant public-key authentication permanently replaces passwords on high-value systems.</text>
      </g>
    </g>
  </g>
</svg>
