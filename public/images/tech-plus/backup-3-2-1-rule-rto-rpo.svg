<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740">
  <defs>
    <style>
      .bg { fill: #070b14; }
      .card-bg { fill: #0d1527; stroke: #1e293b; stroke-width: 1.5; rx: 10px; }
      .inner-card { fill: #111c35; stroke: #25334d; stroke-width: 1; rx: 6px; }
      .text-title { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 26px; font-weight: 700; fill: #f8fafc; }
      .text-subtitle { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 14px; fill: #94a3b8; }
      .text-section { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
      .text-label { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 12px; fill: #94a3b8; }
      .text-val-mono { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 11px; fill: #e2e8f0; }
      .badge-text { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; text-anchor: middle; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="740" class="bg" />
  <rect x="15" y="15" width="1170" height="710" rx="14" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- Title Header -->
  <g transform="translate(45, 55)">
    <text class="text-title" x="0" y="0">Disaster Recovery &amp; Availability Architecture</text>
    <text class="text-subtitle" x="0" y="24">The 3-2-1 Backup Rule, RTO vs. RPO Operational Metrics, and Immutable Storage (FC0-U71 5.4, 6.1)</text>
    <rect x="0" y="38" width="1110" height="1" fill="#1e293b" />
  </g>

  <!-- Top Panel: 3-2-1 Rule & RTO/RPO Metrics (x=45, y=115, width=1110, height=310) -->
  <g transform="translate(45, 115)">
    <rect width="1110" height="310" class="card-bg" stroke="#0284c7" />
    <text class="text-section" x="20" y="24" fill="#38bdf8">1. Enterprise Availability: The 3-2-1 Backup Rule &amp; Recovery Metrics</text>
    <text class="text-label" text-anchor="end" x="1090" y="24">CompTIA Tech+ (FC0-U71) Objectives 5.4 &amp; 6.1</text>

    <!-- Left Box: The 3-2-1 Backup Rule -->
    <g transform="translate(20, 36)">
      <rect width="525" height="258" class="inner-card" stroke="#f59e0b" />
      <rect x="12" y="10" width="190" height="22" rx="4" fill="#451a03" />
      <text x="107" y="25" class="badge-text" fill="#fcd34d">THE 3-2-1 BACKUP RULE</text>
      <text x="212" y="25" class="text-label" fill="#fde68a">Industry Gold Standard</text>

      <!-- 3 Sub-Blocks -->
      <g transform="translate(12, 38)">
        <rect width="501" height="56" rx="4" fill="#070b14" stroke="#1e293b" />
        <rect x="10" y="10" width="36" height="36" rx="4" fill="#0c2340" stroke="#38bdf8" />
        <text x="28" y="33" class="badge-text" font-size="16px" fill="#38bdf8">3</text>
        <text x="56" y="25" class="text-val-mono" font-size="11px" font-weight="700" fill="#38bdf8">COPIES OF TOTAL DATA</text>
        <text x="56" y="43" class="text-label" font-size="10.5px" fill="#cbd5e1">1 Primary Production copy + 2 Separate Backup copies.</text>

        <rect y="64" width="501" height="56" rx="4" fill="#070b14" stroke="#1e293b" />
        <rect x="10" y="74" width="36" height="36" rx="4" fill="#064e3b" stroke="#10b981" />
        <text x="28" y="97" class="badge-text" font-size="16px" fill="#34d399">2</text>
        <text x="56" y="89" class="text-val-mono" font-size="11px" font-weight="700" fill="#34d399">DIFFERENT STORAGE MEDIA</text>
        <text x="56" y="107" class="text-label" font-size="10.5px" fill="#cbd5e1">Protects against medium decay: NVMe NAS + LTO Tape or HDD.</text>

        <rect y="128" width="501" height="56" rx="4" fill="#070b14" stroke="#1e293b" />
        <rect x="10" y="138" width="36" height="36" rx="4" fill="#2e1065" stroke="#8b5cf6" />
        <text x="28" y="161" class="badge-text" font-size="16px" fill="#c084fc">1</text>
        <text x="56" y="153" class="text-val-mono" font-size="11px" font-weight="700" fill="#c084fc">OFFSITE IMMUTABLE COPY</text>
        <text x="56" y="171" class="text-label" font-size="10.5px" fill="#cbd5e1">Physical separation: Remote facility or Cloud Object Lock (S3).</text>
      </g>

      <text x="14" y="244" class="text-label" font-size="10.5px" fill="#93c5fd">Modern Extension (3-2-1-1-0): 1 Immutable + 0 Errors on restore drill.</text>
    </g>

    <!-- Right Box: RTO vs RPO Metrics -->
    <g transform="translate(565, 36)">
      <rect width="525" height="258" class="inner-card" stroke="#38bdf8" />
      <rect x="12" y="10" width="190" height="22" rx="4" fill="#0c2340" />
      <text x="107" y="25" class="badge-text" fill="#38bdf8">RTO VS. RPO METRICS</text>
      <text x="212" y="25" class="text-label" fill="#93c5fd">Disaster Recovery Targets</text>

      <!-- Timeline Diagram -->
      <g transform="translate(12, 38)">
        <rect width="501" height="80" rx="4" fill="#070b14" stroke="#1e293b" />

        <!-- Timeline axis -->
        <line x1="30" y1="42" x2="470" y2="42" stroke="#334155" stroke-width="2" />

        <!-- Event Markers -->
        <circle cx="90" cy="42" r="5" fill="#38bdf8" />
        <text x="90" y="24" class="badge-text" font-size="9.5px" fill="#38bdf8">BACKUP POINT</text>
        <text x="90" y="60" class="text-val-mono" font-size="9px" text-anchor="middle" fill="#94a3b8">02:00 AM</text>

        <circle cx="250" cy="42" r="7" fill="#ef4444" />
        <text x="250" y="24" class="badge-text" font-size="10px" fill="#f87171">DISASTER!</text>
        <text x="250" y="60" class="text-val-mono" font-size="9px" text-anchor="middle" fill="#f87171">06:00 AM</text>

        <circle cx="410" cy="42" r="5" fill="#10b981" />
        <text x="410" y="24" class="badge-text" font-size="9.5px" fill="#34d399">RESTORED</text>
        <text x="410" y="60" class="text-val-mono" font-size="9px" text-anchor="middle" fill="#94a3b8">08:00 AM</text>

        <!-- RPO Bracket -->
        <path d="M 95 48 L 95 54 L 245 54 L 245 48" fill="none" stroke="#f59e0b" stroke-width="1.5" />
        <text x="170" y="70" class="badge-text" font-size="9px" fill="#fcd34d">RPO: 4 Hrs Data Loss</text>

        <!-- RTO Bracket -->
        <path d="M 255 48 L 255 54 L 405 54 L 405 48" fill="none" stroke="#38bdf8" stroke-width="1.5" />
        <text x="330" y="70" class="badge-text" font-size="9px" fill="#93c5fd">RTO: 2 Hrs Downtime</text>
      </g>

      <!-- RPO / RTO Definitions -->
      <g transform="translate(12, 126)">
        <rect width="501" height="54" rx="4" fill="#070b14" stroke="#1e293b" />
        <text x="14" y="20" class="text-val-mono" font-size="10.5px" font-weight="700" fill="#fcd34d">RPO (Recovery Point Objective) = Maximum Data Loss:</text>
        <text x="14" y="38" class="text-label" font-size="10px" fill="#cbd5e1">The maximum acceptable age of files before disaster strikes (how much lost data).</text>

        <rect y="60" width="501" height="54" rx="4" fill="#070b14" stroke="#1e293b" />
        <text x="14" y="80" class="text-val-mono" font-size="10.5px" font-weight="700" fill="#38bdf8">RTO (Recovery Time Objective) = Maximum Downtime:</text>
        <text x="14" y="98" class="text-label" font-size="10px" fill="#cbd5e1">The maximum acceptable duration required to restore business operations.</text>
      </g>
    </g>
  </g>

  <!-- Bottom Panel: Backup Schemes & Ransomware Defense (x=45, y=440, width=1110, height=275) -->
  <g transform="translate(45, 440)">
    <rect width="1110" height="275" class="card-bg" stroke="#10b981" />
    <text class="text-section" x="20" y="24" fill="#34d399">2. Backup Execution: Schemes, Ransomware Defense, and Verification</text>
    <text class="text-label" text-anchor="end" x="1090" y="24">Operational Hardening</text>

    <!-- Left Box: Full vs Differential vs Incremental -->
    <g transform="translate(20, 36)">
      <rect width="525" height="222" class="inner-card" stroke="#8b5cf6" />
      <rect x="12" y="10" width="190" height="22" rx="4" fill="#2e1065" />
      <text x="107" y="25" class="badge-text" fill="#c084fc">BACKUP TYPES</text>
      <text x="212" y="25" class="text-label" fill="#ddd6fe">Speed vs. Restore Complexity</text>

      <g transform="translate(12, 38)">
        <rect width="501" height="48" rx="4" fill="#070b14" stroke="#1e293b" />
        <text x="14" y="20" class="text-val-mono" font-size="10.5px" font-weight="700" fill="#38bdf8">Full Backup:</text>
        <text x="14" y="36" class="text-label" font-size="10px" fill="#cbd5e1">Copies all data. Slowest backup speed; fastest restore (needs 1 set).</text>

        <rect y="54" width="501" height="48" rx="4" fill="#070b14" stroke="#1e293b" />
        <text x="14" y="74" class="text-val-mono" font-size="10.5px" font-weight="700" fill="#fcd34d">Differential Backup:</text>
        <text x="14" y="90" class="text-label" font-size="10px" fill="#cbd5e1">Copies changes since last Full. Restore requires Full + latest Differential.</text>

        <rect y="108" width="501" height="48" rx="4" fill="#070b14" stroke="#1e293b" />
        <text x="14" y="128" class="text-val-mono" font-size="10.5px" font-weight="700" fill="#34d399">Incremental Backup:</text>
        <text x="14" y="144" class="text-label" font-size="10px" fill="#cbd5e1">Copies changes since last Incremental. Fastest backup; slow chain restore.</text>
      </g>

      <text x="14" y="208" class="text-label" font-size="10.5px" fill="#c084fc">Standard Policy: Weekly Full + Daily Differential or Hourly Incremental.</text>
    </g>

    <!-- Right Box: Immutable Storage & Restoration Drills -->
    <g transform="translate(565, 36)">
      <rect width="525" height="222" class="inner-card" stroke="#10b981" />
      <rect x="12" y="10" width="190" height="22" rx="4" fill="#064e3b" />
      <text x="107" y="25" class="badge-text" fill="#34d399">RANSOMWARE RESILIENCE</text>
      <text x="212" y="25" class="text-label" fill="#a7f3d0">Immutable Protection</text>

      <g transform="translate(12, 38)">
        <rect width="501" height="48" rx="4" fill="#070b14" stroke="#1e293b" />
        <text x="14" y="20" class="text-val-mono" font-size="10.5px" font-weight="700" fill="#34d399">WORM Storage (Write Once, Read Many):</text>
        <text x="14" y="36" class="text-label" font-size="10px" fill="#cbd5e1">Enforces Object Lock; malware cannot delete or encrypt backup files.</text>

        <rect y="54" width="501" height="48" rx="4" fill="#070b14" stroke="#1e293b" />
        <text x="14" y="74" class="text-val-mono" font-size="10.5px" font-weight="700" fill="#38bdf8">Physical Air-Gapping:</text>
        <text x="14" y="90" class="text-label" font-size="10px" fill="#cbd5e1">Offline LTO tapes or unmounted drives severed from network routes.</text>

        <rect y="108" width="501" height="48" rx="4" fill="#070b14" stroke="#1e293b" />
        <text x="14" y="128" class="text-val-mono" font-size="10.5px" font-weight="700" fill="#f87171">Technician Rule: Routine Recovery Drills:</text>
        <text x="14" y="144" class="text-label" font-size="10px" fill="#cbd5e1">An untested backup is not a backup! Practice quarterly restoration tests.</text>
      </g>

      <text x="14" y="208" class="text-label" font-size="10.5px" fill="#a7f3d0">Tested Backups ensure business continuity even during catastrophic breaches.</text>
    </g>
  </g>
</svg>
