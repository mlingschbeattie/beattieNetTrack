<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740">
  <defs>
    <style>
      .bg { fill: #070b14; }
      .card-bg { fill: #0d1527; stroke: #1e293b; stroke-width: 1.5; rx: 12px; }
      .inner-card { fill: #111c35; stroke: #25334d; stroke-width: 1.5; rx: 8px; }
      .text-title { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 26px; font-weight: 700; fill: #f8fafc; }
      .text-subtitle { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 15px; fill: #94a3b8; }
      .text-section { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 14px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
      .text-label { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
      .text-val-mono { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 13px; fill: #e2e8f0; }
      .badge-text { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; text-anchor: middle; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="740" class="bg" />
  <rect x="15" y="15" width="1170" height="710" rx="14" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- Title Header -->
  <g transform="translate(45, 55)">
    <text class="text-title" x="0" y="0">Data Backups &amp; Disaster Recovery</text>
    <text class="text-subtitle" x="0" y="24">The 3-2-1 Rule and Recovery Targets (CompTIA Tech+ FC0-U71)</text>
    <rect x="0" y="38" width="1110" height="1" fill="#1e293b" />
  </g>

  <!-- Top Panel: The 3-2-1 Backup Rule (x=45, y=115, width=1110, height=310) -->
  <g transform="translate(45, 115)">
    <rect width="1110" height="310" class="card-bg" stroke="#0284c7" />
    <text class="text-section" x="24" y="28" fill="#38bdf8">The 3-2-1 Backup Rule: How Companies Protect Data</text>
    <text class="text-label" text-anchor="end" x="1086" y="28">Golden Rule of Backups</text>

    <!-- Card 1: 3 COPIES -->
    <g transform="translate(24, 46)">
      <rect width="340" height="238" class="inner-card" stroke="#38bdf8" stroke-width="2" />
      
      <!-- Big Number Badge -->
      <circle cx="170" cy="52" r="32" fill="#0c2340" stroke="#38bdf8" stroke-width="2" />
      <text x="170" y="62" font-family="'Segoe UI', sans-serif" font-size="32px" font-weight="900" fill="#38bdf8" text-anchor="middle">3</text>
      
      <text x="170" y="112" class="badge-text" font-size="16px" fill="#f8fafc">COPIES OF DATA</text>
      <text x="170" y="134" class="text-label" font-size="13px" fill="#93c5fd" text-anchor="middle">Never rely on a single copy!</text>

      <!-- Visual Icons / Shapes -->
      <g transform="translate(25, 150)">
        <rect x="0" y="0" width="85" height="60" rx="6" fill="#070b14" stroke="#38bdf8" />
        <text x="42" y="26" class="badge-text" font-size="11px" fill="#38bdf8">COPY 1</text>
        <text x="42" y="44" class="text-label" font-size="10px" text-anchor="middle" fill="#cbd5e1">Production</text>

        <rect x="102" y="0" width="85" height="60" rx="6" fill="#070b14" stroke="#22d3ee" />
        <text x="144" y="26" class="badge-text" font-size="11px" fill="#22d3ee">COPY 2</text>
        <text x="144" y="44" class="text-label" font-size="10px" text-anchor="middle" fill="#cbd5e1">Local NAS</text>

        <rect x="205" y="0" width="85" height="60" rx="6" fill="#070b14" stroke="#818cf8" />
        <text x="247" y="26" class="badge-text" font-size="11px" fill="#818cf8">COPY 3</text>
        <text x="247" y="44" class="text-label" font-size="10px" text-anchor="middle" fill="#cbd5e1">Offsite Vault</text>
      </g>
    </g>

    <!-- Card 2: 2 MEDIA TYPES -->
    <g transform="translate(385, 46)">
      <rect width="340" height="238" class="inner-card" stroke="#10b981" stroke-width="2" />
      
      <!-- Big Number Badge -->
      <circle cx="170" cy="52" r="32" fill="#064e3b" stroke="#10b981" stroke-width="2" />
      <text x="170" y="62" font-family="'Segoe UI', sans-serif" font-size="32px" font-weight="900" fill="#34d399" text-anchor="middle">2</text>
      
      <text x="170" y="112" class="badge-text" font-size="16px" fill="#f8fafc">DIFFERENT MEDIA TYPES</text>
      <text x="170" y="134" class="text-label" font-size="13px" fill="#a7f3d0" text-anchor="middle">No single hardware point of failure</text>

      <!-- Visual Icons / Shapes -->
      <g transform="translate(30, 150)">
        <rect x="0" y="0" width="130" height="60" rx="6" fill="#070b14" stroke="#10b981" />
        <text x="65" y="26" class="badge-text" font-size="12px" fill="#34d399">MEDIA TYPE A</text>
        <text x="65" y="44" class="text-label" font-size="11px" text-anchor="middle" fill="#cbd5e1">NVMe SSD / RAID</text>

        <text x="140" y="34" font-family="'Segoe UI', sans-serif" font-size="18px" font-weight="700" fill="#64748b" text-anchor="middle">+</text>

        <rect x="150" y="0" width="130" height="60" rx="6" fill="#070b14" stroke="#059669" />
        <text x="215" y="26" class="badge-text" font-size="12px" fill="#6ee7b7">MEDIA TYPE B</text>
        <text x="215" y="44" class="text-label" font-size="11px" text-anchor="middle" fill="#cbd5e1">LTO Tape / HDD</text>
      </g>
    </g>

    <!-- Card 3: 1 OFFSITE COPY -->
    <g transform="translate(746, 46)">
      <rect width="340" height="238" class="inner-card" stroke="#f59e0b" stroke-width="2" />
      
      <!-- Big Number Badge -->
      <circle cx="170" cy="52" r="32" fill="#451a03" stroke="#f59e0b" stroke-width="2" />
      <text x="170" y="62" font-family="'Segoe UI', sans-serif" font-size="32px" font-weight="900" fill="#fcd34d" text-anchor="middle">1</text>
      
      <text x="170" y="112" class="badge-text" font-size="16px" fill="#f8fafc">OFFSITE / CLOUD COPY</text>
      <text x="170" y="134" class="text-label" font-size="13px" fill="#fde68a" text-anchor="middle">Survives fire, flood, or ransomware</text>

      <!-- Visual Icons / Shapes -->
      <g transform="translate(30, 150)">
        <rect x="0" y="0" width="115" height="60" rx="6" fill="#070b14" stroke="#64748b" />
        <text x="57" y="26" class="badge-text" font-size="11px" fill="#94a3b8">MAIN OFFICE</text>
        <text x="57" y="44" class="text-label" font-size="10px" text-anchor="middle" fill="#cbd5e1">Local Facility</text>

        <path d="M 122 30 L 158 30" stroke="#f59e0b" stroke-width="2.5" />
        <polygon points="158,26 166,30 158,34" fill="#f59e0b" />

        <rect x="165" y="0" width="115" height="60" rx="6" fill="#070b14" stroke="#f59e0b" />
        <text x="222" y="26" class="badge-text" font-size="11px" fill="#fcd34d">REMOTE CLOUD</text>
        <text x="222" y="44" class="text-label" font-size="10px" text-anchor="middle" fill="#fde68a">Immutable Vault</text>
      </g>
    </g>
  </g>

  <!-- Bottom Panel: Recovery Timeline (RTO vs RPO) (x=45, y=445, width=1110, height=270) -->
  <g transform="translate(45, 445)">
    <rect width="1110" height="270" class="card-bg" stroke="#8b5cf6" />
    <text class="text-section" x="24" y="28" fill="#c084fc">Disaster Timeline: RPO vs. RTO (How Much Lost vs. How Long Down)</text>
    <text class="text-label" text-anchor="end" x="1086" y="28">Business Impact Metrics</text>

    <!-- Visual Timeline Container -->
    <rect x="24" y="46" width="1062" height="126" rx="8" fill="#070b14" stroke="#1e293b" />

    <!-- Connecting Timeline Track -->
    <line x1="80" y1="84" x2="980" y2="84" stroke="#334155" stroke-width="3" />

    <!-- Event 1: Last Backup -->
    <g transform="translate(180, 84)">
      <circle cx="0" cy="0" r="8" fill="#38bdf8" />
      <rect x="-70" y="-46" width="140" height="42" rx="6" fill="#0c2340" stroke="#38bdf8" stroke-width="1.5" />
      <text x="0" y="-26" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11px" font-weight="700" fill="#38bdf8">1. LAST BACKUP</text>
      <text x="0" y="-10" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12px" font-weight="700" fill="#ffffff">2:00 AM</text>
    </g>

    <!-- Event 2: Disaster Strikes -->
    <g transform="translate(540, 84)">
      <circle cx="0" cy="0" r="10" fill="#ef4444" />
      <rect x="-75" y="-46" width="150" height="42" rx="6" fill="#450a0a" stroke="#ef4444" stroke-width="1.5" />
      <text x="0" y="-26" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11px" font-weight="700" fill="#fca5a5">2. SYSTEM CRASH</text>
      <text x="0" y="-10" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12px" font-weight="700" fill="#ffffff">6:00 AM</text>
    </g>

    <!-- Event 3: Restored -->
    <g transform="translate(880, 84)">
      <circle cx="0" cy="0" r="8" fill="#10b981" />
      <rect x="-70" y="-46" width="140" height="42" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
      <text x="0" y="-26" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11px" font-weight="700" fill="#34d399">3. BACK ONLINE</text>
      <text x="0" y="-10" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12px" font-weight="700" fill="#ffffff">8:00 AM</text>
    </g>

    <!-- RPO Span Indicator (Between Backup and Crash) -->
    <path d="M 210 98 L 210 110 L 510 110 L 510 98" fill="none" stroke="#f59e0b" stroke-width="2" />
    <rect x="280" y="122" width="220" height="28" rx="5" fill="#451a03" stroke="#f59e0b" stroke-width="1.5" />
    <text x="390" y="141" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11px" font-weight="700" fill="#fcd34d">RPO: 4 HOURS LOST DATA</text>

    <!-- RTO Span Indicator (Between Crash and Online) -->
    <path d="M 570 98 L 570 110 L 850 110 L 850 98" fill="none" stroke="#38bdf8" stroke-width="2" />
    <rect x="630" y="122" width="210" height="28" rx="5" fill="#0c2340" stroke="#38bdf8" stroke-width="1.5" />
    <text x="735" y="141" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11px" font-weight="700" fill="#38bdf8">RTO: 2 HOURS DOWNTIME</text>

    <!-- Bottom Clear Summary Takeaways -->
    <g transform="translate(24, 184)">
      <rect x="0" y="0" width="520" height="68" rx="6" fill="#111c35" stroke="#f59e0b" stroke-width="1.5" />
      <text x="20" y="26" text-anchor="start" font-family="'JetBrains Mono', monospace" font-size="13px" font-weight="700" fill="#fcd34d">RPO (Recovery Point Objective)</text>
      <text x="20" y="50" text-anchor="start" font-family="'Segoe UI', sans-serif" font-size="13px" font-weight="600" fill="#f8fafc">➔ "HOW MUCH DATA CAN WE AFFORD TO LOSE?"</text>

      <rect x="542" y="0" width="520" height="68" rx="6" fill="#111c35" stroke="#38bdf8" stroke-width="1.5" />
      <text x="562" y="26" text-anchor="start" font-family="'JetBrains Mono', monospace" font-size="13px" font-weight="700" fill="#38bdf8">RTO (Recovery Time Objective)</text>
      <text x="562" y="50" text-anchor="start" font-family="'Segoe UI', sans-serif" font-size="13px" font-weight="600" fill="#f8fafc">➔ "HOW LONG CAN WE AFFORD TO BE DOWN?"</text>
    </g>
  </g>
</svg>
