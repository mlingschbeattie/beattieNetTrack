<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740">
  <defs>
    <style>
      .bg { fill: #070b14; }
      .card-bg { fill: #0d1527; stroke: #1e293b; stroke-width: 1.5; rx: 10px; }
      .inner-card { fill: #111c35; stroke: #25334d; stroke-width: 1; rx: 6px; }
      .text-title { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 26px; font-weight: 700; fill: #f8fafc; }
      .text-subtitle { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 14px; fill: #94a3b8; }
      .text-section { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
      .text-label { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 12px; fill: #94a3b8; }
      .text-val-mono { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 11px; fill: #e2e8f0; }
      .badge-text { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; text-anchor: middle; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="740" class="bg" />
  <rect x="15" y="15" width="1170" height="710" rx="14" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- Title Header -->
  <g transform="translate(45, 55)">
    <text class="text-title" x="0" y="0">Data States &amp; Cryptographic Controls Architecture</text>
    <text class="text-subtitle" x="0" y="24">Data at Rest, In Transit, and In Use — Protection Controls &amp; NIST SP 800-88 Sanitization (FC0-U71 6.4)</text>
    <rect x="0" y="38" width="1110" height="1" fill="#1e293b" />
  </g>

  <!-- Top Panel: The Three Data States (x=45, y=115, width=1110, height=310) -->
  <g transform="translate(45, 115)">
    <rect width="1110" height="310" class="card-bg" stroke="#0284c7" />
    <text class="text-section" x="20" y="24" fill="#38bdf8">1. Physical States of Digital Data &amp; Corresponding Controls</text>
    <text class="text-label" text-anchor="end" x="1090" y="24">CompTIA Tech+ (FC0-U71) Objective 6.4</text>

    <!-- State 1: Data at Rest -->
    <g transform="translate(20, 36)">
      <rect width="345" height="258" class="inner-card" stroke="#f59e0b" />
      <rect x="10" y="10" width="140" height="22" rx="4" fill="#451a03" />
      <text x="80" y="25" class="badge-text" fill="#fcd34d">1. DATA AT REST</text>
      <text x="160" y="25" class="text-label" font-size="11px" fill="#fde68a">Stored on Media</text>

      <rect x="10" y="38" width="325" height="114" rx="4" fill="#070b14" stroke="#1e293b" />
      <text x="16" y="56" class="text-val-mono" font-size="10.5px" font-weight="700" fill="#fcd34d">Where Data Resides:</text>
      <text x="16" y="72" class="text-label" font-size="10.5px" fill="#cbd5e1">• NVMe SSDs, HDDs, SAN/NAS partitions</text>
      <text x="16" y="90" class="text-label" font-size="10.5px" fill="#cbd5e1">• Backup tapes, flash drives, database tables</text>
      <text x="16" y="112" class="text-val-mono" font-size="10px" fill="#f87171">Primary Threat: Laptop theft or drive cloning.</text>
      <text x="16" y="130" class="text-label" font-size="10px" fill="#94a3b8">Unencrypted drives can be mounted on foreign PCs.</text>

      <rect x="10" y="158" width="325" height="90" rx="4" fill="#111c35" stroke="#f59e0b" />
      <text x="16" y="176" class="text-val-mono" font-size="10.5px" font-weight="700" fill="#fcd34d">Cryptographic Controls:</text>
      <text x="16" y="194" class="text-label" font-size="10px" fill="#cbd5e1">• Full Disk Encryption: BitLocker + TPM, FileVault</text>
      <text x="16" y="210" class="text-label" font-size="10px" fill="#cbd5e1">• Self-Encrypting Drives (SEDs) with AES-256</text>
      <text x="16" y="228" class="text-val-mono" font-size="10px" fill="#fde68a">Database Transparent Data Encryption (TDE)</text>
    </g>

    <!-- State 2: Data in Transit -->
    <g transform="translate(380, 36)">
      <rect width="345" height="258" class="inner-card" stroke="#38bdf8" />
      <rect x="10" y="10" width="150" height="22" rx="4" fill="#0c2340" />
      <text x="85" y="25" class="badge-text" fill="#38bdf8">2. DATA IN TRANSIT</text>
      <text x="170" y="25" class="text-label" font-size="11px" fill="#93c5fd">Network Wire/Air</text>

      <rect x="10" y="38" width="325" height="114" rx="4" fill="#070b14" stroke="#1e293b" />
      <text x="16" y="56" class="text-val-mono" font-size="10.5px" font-weight="700" fill="#38bdf8">Where Data Resides:</text>
      <text x="16" y="72" class="text-label" font-size="10.5px" fill="#cbd5e1">• Ethernet cables, Wi-Fi radio frequencies</text>
      <text x="16" y="90" class="text-label" font-size="10.5px" fill="#cbd5e1">• Public Internet routing hops, VPN tunnels</text>
      <text x="16" y="112" class="text-val-mono" font-size="10px" fill="#f87171">Primary Threat: Packet sniffing &amp; MITM attacks.</text>
      <text x="16" y="130" class="text-label" font-size="10px" fill="#94a3b8">Unencrypted HTTP/FTP traffic leaks plain passwords.</text>

      <rect x="10" y="158" width="325" height="90" rx="4" fill="#111c35" stroke="#0284c7" />
      <text x="16" y="176" class="text-val-mono" font-size="10.5px" font-weight="700" fill="#38bdf8">Cryptographic Controls:</text>
      <text x="16" y="194" class="text-label" font-size="10px" fill="#cbd5e1">• Transport Layer Security: TLS 1.3 (HTTPS)</text>
      <text x="16" y="210" class="text-label" font-size="10px" fill="#cbd5e1">• Virtual Private Networks: IPsec &amp; WireGuard</text>
      <text x="16" y="228" class="text-val-mono" font-size="10px" fill="#93c5fd">Secure Shell (SSHv2) &amp; WPA3-Enterprise</text>
    </g>

    <!-- State 3: Data in Use -->
    <g transform="translate(740, 36)">
      <rect width="350" height="258" class="inner-card" stroke="#10b981" />
      <rect x="10" y="10" width="130" height="22" rx="4" fill="#064e3b" />
      <text x="75" y="25" class="badge-text" fill="#34d399">3. DATA IN USE</text>
      <text x="150" y="25" class="text-label" font-size="11px" fill="#a7f3d0">RAM &amp; CPU Silicon</text>

      <rect x="10" y="38" width="330" height="114" rx="4" fill="#070b14" stroke="#1e293b" />
      <text x="16" y="56" class="text-val-mono" font-size="10.5px" font-weight="700" fill="#34d399">Where Data Resides:</text>
      <text x="16" y="72" class="text-label" font-size="10.5px" fill="#cbd5e1">• System RAM (DDR4/DDR5 memory chips)</text>
      <text x="16" y="90" class="text-label" font-size="10.5px" fill="#cbd5e1">• CPU L1/L2/L3 cache, silicon registers</text>
      <text x="16" y="112" class="text-val-mono" font-size="10px" fill="#f87171">Primary Threat: RAM scraping &amp; memory dumps.</text>
      <text x="16" y="130" class="text-label" font-size="10px" fill="#94a3b8">Adversaries extract plain keys from active memory.</text>

      <rect x="10" y="158" width="330" height="90" rx="4" fill="#111c35" stroke="#10b981" />
      <text x="16" y="176" class="text-val-mono" font-size="10.5px" font-weight="700" fill="#34d399">Cryptographic Controls:</text>
      <text x="16" y="194" class="text-label" font-size="10px" fill="#cbd5e1">• Secure Enclaves (Intel SGX, AMD SEV)</text>
      <text x="16" y="210" class="text-label" font-size="10px" fill="#cbd5e1">• Confidential Computing: Hardware-encrypted RAM</text>
      <text x="16" y="228" class="text-val-mono" font-size="10px" fill="#a7f3d0">Kernel DMA Protection &amp; Memory Isolation</text>
    </g>
  </g>

  <!-- Bottom Panel: Compliance Classifications & Media Sanitization (x=45, y=440, width=1110, height=275) -->
  <g transform="translate(45, 440)">
    <rect width="1110" height="275" class="card-bg" stroke="#10b981" />
    <text class="text-section" x="20" y="24" fill="#34d399">2. Compliance Classifications &amp; NIST SP 800-88 Media Sanitization</text>
    <text class="text-label" text-anchor="end" x="1090" y="24">Production Standards</text>

    <!-- Left Box: Regulated Data Types -->
    <g transform="translate(20, 36)">
      <rect width="525" height="222" class="inner-card" stroke="#8b5cf6" />
      <rect x="12" y="10" width="220" height="22" rx="4" fill="#2e1065" />
      <text x="122" y="25" class="badge-text" fill="#c084fc">COMPLIANCE CLASSIFICATIONS</text>
      <text x="245" y="25" class="text-label" fill="#ddd6fe">Regulated Data Types</text>

      <g transform="translate(12, 38)">
        <rect width="501" height="48" rx="4" fill="#070b14" stroke="#1e293b" />
        <text x="14" y="20" class="text-val-mono" font-size="10.5px" font-weight="700" fill="#38bdf8">PII (Personally Identifiable Information):</text>
        <text x="14" y="36" class="text-label" font-size="10px" fill="#cbd5e1">Full name, Social Security Number (SSN), driver's license, home address, biometrics.</text>

        <rect y="54" width="501" height="48" rx="4" fill="#070b14" stroke="#1e293b" />
        <text x="14" y="74" class="text-val-mono" font-size="10.5px" font-weight="700" fill="#fcd34d">PHI (Protected Health Information - HIPAA):</text>
        <text x="14" y="90" class="text-label" font-size="10px" fill="#cbd5e1">Medical histories, doctor notes, lab diagnoses, health insurance billing records.</text>

        <rect y="108" width="501" height="48" rx="4" fill="#070b14" stroke="#1e293b" />
        <text x="14" y="128" class="text-val-mono" font-size="10.5px" font-weight="700" fill="#f87171">PCI-DSS (Payment Card Industry Standards):</text>
        <text x="14" y="144" class="text-label" font-size="10px" fill="#cbd5e1">Primary Account Numbers (PAN), expiration dates, CVV security codes, magnetic track.</text>
      </g>

      <text x="14" y="208" class="text-label" font-size="10.5px" fill="#c084fc">Compliance Rule: Legal fines mandate encrypting PII, PHI, and PCI at all times.</text>
    </g>

    <!-- Right Box: NIST SP 800-88 Media Sanitization -->
    <g transform="translate(565, 36)">
      <rect width="525" height="222" class="inner-card" stroke="#f59e0b" />
      <rect x="12" y="10" width="220" height="22" rx="4" fill="#451a03" />
      <text x="122" y="25" class="badge-text" fill="#fcd34d">NIST SP 800-88 SANITIZATION</text>
      <text x="245" y="25" class="text-label" fill="#fde68a">Decommissioning Standards</text>

      <g transform="translate(12, 38)">
        <rect width="501" height="48" rx="4" fill="#070b14" stroke="#1e293b" />
        <text x="14" y="20" class="text-val-mono" font-size="10.5px" font-weight="700" fill="#34d399">1. Clear (Logical Overwrite):</text>
        <text x="14" y="36" class="text-label" font-size="10px" fill="#cbd5e1">Overwrites addressable sectors with zeros. Prevents standard software data recovery.</text>

        <rect y="54" width="501" height="48" rx="4" fill="#070b14" stroke="#1e293b" />
        <text x="14" y="74" class="text-val-mono" font-size="10.5px" font-weight="700" fill="#38bdf8">2. Purge (Cryptographic Erase / Degauss):</text>
        <text x="14" y="90" class="text-label" font-size="10px" fill="#cbd5e1">Destroys Master Encryption Keys (Crypto Erase) or uses magnetic degausser on HDDs.</text>

        <rect y="108" width="501" height="48" rx="4" fill="#070b14" stroke="#1e293b" />
        <text x="14" y="128" class="text-val-mono" font-size="10.5px" font-weight="700" fill="#f87171">3. Destroy (Physical Obliteration):</text>
        <text x="14" y="144" class="text-label" font-size="10px" fill="#cbd5e1">Physical shredding, disintegration, or incineration. Mandatory for top-secret media.</text>
      </g>

      <text x="14" y="208" class="text-label" font-size="10.5px" fill="#fcd34d">Technician Takeaway: Formatting or moving files to Recycle Bin is NOT sanitization!</text>
    </g>
  </g>
</svg>
