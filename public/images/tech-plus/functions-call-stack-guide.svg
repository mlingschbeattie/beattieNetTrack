<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #070b14; }
      .card-bg { fill: #0d1527; stroke: #1e293b; stroke-width: 1.5; rx: 10px; }
      .inner-card { fill: #111c35; stroke: #25334d; stroke-width: 1; rx: 6px; }
      .text-title { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 26px; font-weight: 700; fill: #f8fafc; }
      .text-subtitle { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 14px; fill: #94a3b8; }
      .text-section { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
      .text-label { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 12px; fill: #94a3b8; }
      .text-val-mono { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 12px; fill: #e2e8f0; }
      .badge-text { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; text-anchor: middle; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="740" class="bg" />
  <rect x="15" y="15" width="1170" height="710" rx="14" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- Title Header -->
  <g transform="translate(45, 55)">
    <text class="text-title" x="0" y="0">Function Architecture &amp; Call Stack Execution</text>
    <text class="text-subtitle" x="0" y="24">Parameters vs. Arguments, Return Values, LIFO Stack Frames, and Stack Overflow Prevention</text>
    <rect x="0" y="38" width="1110" height="1" fill="#1e293b" />
  </g>

  <!-- Top Left: Parameters vs. Arguments (x=45, y=115, width=545, height=275) -->
  <g transform="translate(45, 115)">
    <rect width="545" height="275" class="card-bg" stroke="#0284c7" />
    <text class="text-section" x="20" y="26" fill="#38bdf8">1. Function Definition vs. Invocation</text>
    <text class="text-label" x="330" y="26">FC0-U71 4.3: Parameters vs. Args</text>

    <!-- Definition Blueprint -->
    <g transform="translate(20, 42)">
      <rect width="505" height="96" class="inner-card" stroke="#1e3a8a" />
      <rect x="12" y="10" width="165" height="22" rx="4" fill="#0c2340" />
      <text x="94" y="25" class="badge-text" fill="#38bdf8">DEFINITION (BLUEPRINT)</text>
      <text x="188" y="25" class="text-label" fill="#93c5fd">Declares formal placeholder variables</text>

      <rect x="12" y="38" width="481" height="46" rx="4" fill="#070b14" stroke="#1e293b" />
      <text x="22" y="58" class="text-val-mono" fill="#e2e8f0"><tspan fill="#ec4899">def</tspan> <tspan fill="#38bdf8">calculate_tax</tspan>(<tspan fill="#f59e0b" font-weight="700">subtotal</tspan>, <tspan fill="#f59e0b" font-weight="700">tax_rate</tspan>):</text>
      <text x="22" y="74" class="text-label" fill="#94a3b8">Parameters (<tspan fill="#f59e0b" font-weight="700">subtotal</tspan>, <tspan fill="#f59e0b" font-weight="700">tax_rate</tspan>): Named variables defined in signature</text>
    </g>

    <!-- Invocation Execution -->
    <g transform="translate(20, 150)">
      <rect width="505" height="110" class="inner-card" stroke="#059669" />
      <rect x="12" y="10" width="165" height="22" rx="4" fill="#064e3b" />
      <text x="94" y="25" class="badge-text" fill="#34d399">CALL / INVOCATION</text>
      <text x="188" y="25" class="text-label" fill="#6ee7b7">Passes actual concrete runtime values</text>

      <rect x="12" y="38" width="481" height="58" rx="4" fill="#070b14" stroke="#1e293b" />
      <text x="22" y="58" class="text-val-mono" fill="#e2e8f0">invoice_tax = <tspan fill="#38bdf8">calculate_tax</tspan>(<tspan fill="#10b981" font-weight="700">100.00</tspan>, <tspan fill="#10b981" font-weight="700">0.08</tspan>)</text>
      <text x="22" y="74" class="text-label" fill="#94a3b8">Arguments (<tspan fill="#10b981" font-weight="700">100.00</tspan>, <tspan fill="#10b981" font-weight="700">0.08</tspan>): Concrete data passed into parameters at call</text>
      <text x="22" y="88" class="text-label" fill="#6ee7b7">Technician Rule: Number &amp; type of arguments must match parameters!</text>
    </g>
  </g>

  <!-- Top Right: Return Values vs Void Functions (x=610, y=115, width=545, height=275) -->
  <g transform="translate(610, 115)">
    <rect width="545" height="275" class="card-bg" stroke="#8b5cf6" />
    <text class="text-section" x="20" y="26" fill="#c084fc">2. Return Values vs. Void Side-Effects</text>
    <text class="text-label" x="320" y="26">FC0-U71 4.3: Output Flow</text>

    <!-- Value-Returning Function -->
    <g transform="translate(20, 42)">
      <rect width="505" height="96" class="inner-card" stroke="#7c3aed" />
      <rect x="12" y="10" width="190" height="22" rx="4" fill="#2e1065" />
      <text x="107" y="25" class="badge-text" fill="#c084fc">VALUE-RETURNING FUNCTION</text>
      <text x="212" y="25" class="text-label" fill="#ddd6fe">Uses <tspan font-family="monospace" fill="#c084fc">return</tspan> statement</text>

      <rect x="12" y="38" width="481" height="46" rx="4" fill="#070b14" stroke="#1e293b" />
      <text x="22" y="56" class="text-val-mono" fill="#cbd5e1"><tspan fill="#ec4899">return</tspan> subtotal * tax_rate  <tspan fill="#64748b"># Sends calculated 8.0 back</tspan></text>
      <text x="22" y="74" class="text-label" fill="#94a3b8">The result passes back to the caller to be stored in a variable or computed.</text>
    </g>

    <!-- Void Function -->
    <g transform="translate(20, 150)">
      <rect width="505" height="110" class="inner-card" stroke="#475569" />
      <rect x="12" y="10" width="190" height="22" rx="4" fill="#1e293b" />
      <text x="107" y="25" class="badge-text" fill="#94a3b8">VOID / SIDE-EFFECT FUNCTION</text>
      <text x="212" y="25" class="text-label" fill="#cbd5e1">No return value (returns None/void)</text>

      <rect x="12" y="38" width="481" height="58" rx="4" fill="#070b14" stroke="#1e293b" />
      <text x="22" y="56" class="text-val-mono" fill="#cbd5e1"><tspan fill="#38bdf8">print</tspan>(<tspan fill="#f59e0b">"System backup completed"</tspan>)  <tspan fill="#64748b"># Performs action only</tspan></text>
      <text x="22" y="74" class="text-label" fill="#94a3b8">Performs actions (writes to console, updates database, sends network packet).</text>
      <text x="22" y="88" class="text-label" fill="#cbd5e1">Trying to assign: <tspan font-family="monospace" fill="#f87171">x = print("hi")</tspan> results in <tspan font-family="monospace" fill="#f87171">x = None</tspan>!</text>
    </g>
  </g>

  <!-- Bottom Left: Call Stack Frame Lifecycle (x=45, y=405, width=720, height=305) -->
  <g transform="translate(45, 405)">
    <rect width="720" height="305" class="card-bg" stroke="#10b981" />
    <text class="text-section" x="20" y="26" fill="#34d399">3. The Call Stack Execution Lifecycle (LIFO - Last In, First Out)</text>
    <text class="text-label" x="480" y="26">CPU &amp; RAM Thread Frame Management</text>

    <!-- 3 Stack States -->
    <!-- Step 1: Initial main() -->
    <g transform="translate(20, 42)">
      <rect width="215" height="245" class="inner-card" stroke="#1e293b" />
      <rect x="10" y="10" width="195" height="22" rx="4" fill="#0f172a" />
      <text x="107" y="25" class="badge-text" fill="#94a3b8">STEP 1: MAIN CALL</text>

      <rect x="10" y="40" width="195" height="110" rx="4" fill="#070b14" stroke="#1e293b" />
      <text x="18" y="58" class="text-val-mono" font-size="11px" fill="#64748b">[ Memory Base ]</text>
      <rect x="18" y="68" width="179" height="70" rx="4" fill="#1e293b" stroke="#38bdf8" />
      <text x="26" y="88" class="text-val-mono" font-size="11px" font-weight="700" fill="#38bdf8">Frame: main()</text>
      <text x="26" y="106" class="text-label" font-size="11px" fill="#cbd5e1">total = 100.00</text>
      <text x="26" y="122" class="text-label" font-size="11px" fill="#94a3b8">Waiting for tax...</text>

      <text x="10" y="170" class="text-label" font-size="11px" fill="#cbd5e1"><tspan font-weight="700" fill="#38bdf8">1. Execution Begins:</tspan></text>
      <text x="10" y="186" class="text-label" font-size="11px" fill="#94a3b8">OS launches process. The</text>
      <text x="10" y="202" class="text-label" font-size="11px" fill="#94a3b8"><tspan font-family="monospace" fill="#e2e8f0">main()</tspan> frame is pushed onto</text>
      <text x="10" y="218" class="text-label" font-size="11px" fill="#94a3b8">thread stack memory.</text>
    </g>

    <!-- Arrow 1 to 2 -->
    <path d="M 242 160 L 258 160" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />

    <!-- Step 2: Push calculate_tax() -->
    <g transform="translate(252, 42)">
      <rect width="215" height="245" class="inner-card" stroke="#0284c7" />
      <rect x="10" y="10" width="195" height="22" rx="4" fill="#0c2340" />
      <text x="107" y="25" class="badge-text" fill="#38bdf8">STEP 2: PUSH FRAME</text>

      <rect x="10" y="40" width="195" height="110" rx="4" fill="#070b14" stroke="#1e293b" />
      <!-- Top Frame -->
      <rect x="18" y="45" width="179" height="50" rx="4" fill="#0284c7" stroke="#38bdf8" />
      <text x="26" y="62" class="text-val-mono" font-size="11px" font-weight="700" fill="#ffffff">Frame: calculate_tax()</text>
      <text x="26" y="78" class="text-label" font-size="10px" fill="#e0f2fe">subtotal=100 | rate=0.08</text>
      <text x="26" y="90" class="text-label" font-size="10px" fill="#bae6fd">Return Addr: line 14</text>
      <!-- Bottom Frame -->
      <rect x="18" y="100" width="179" height="42" rx="4" fill="#1e293b" stroke="#475569" />
      <text x="26" y="118" class="text-val-mono" font-size="11px" fill="#94a3b8">Frame: main() [PAUSED]</text>

      <text x="10" y="170" class="text-label" font-size="11px" fill="#cbd5e1"><tspan font-weight="700" fill="#38bdf8">2. Function Called:</tspan></text>
      <text x="10" y="186" class="text-label" font-size="11px" fill="#94a3b8">New frame pushed on top.</text>
      <text x="10" y="202" class="text-label" font-size="11px" fill="#94a3b8">CPU pauses main() and runs</text>
      <text x="10" y="218" class="text-label" font-size="11px" fill="#94a3b8">callee with local arguments.</text>
    </g>

    <!-- Arrow 2 to 3 -->
    <path d="M 474 160 L 490 160" stroke="#10b981" stroke-width="2" />

    <!-- Step 3: Pop & Reclaim -->
    <g transform="translate(485, 42)">
      <rect width="215" height="245" class="inner-card" stroke="#059669" />
      <rect x="10" y="10" width="195" height="22" rx="4" fill="#064e3b" />
      <text x="107" y="25" class="badge-text" fill="#34d399">STEP 3: POP &amp; RETURN</text>

      <rect x="10" y="40" width="195" height="110" rx="4" fill="#070b14" stroke="#1e293b" />
      <!-- Popped ghost frame -->
      <rect x="18" y="45" width="179" height="30" rx="4" fill="none" stroke="#f87171" stroke-dasharray="3,3" />
      <text x="26" y="64" class="text-val-mono" font-size="10px" fill="#f87171">Frame POPPED (Reclaimed)</text>
      <!-- Resumed main -->
      <rect x="18" y="82" width="179" height="60" rx="4" fill="#064e3b" stroke="#34d399" />
      <text x="26" y="100" class="text-val-mono" font-size="11px" font-weight="700" fill="#34d399">Frame: main() [RESUMED]</text>
      <text x="26" y="116" class="text-label" font-size="10px" fill="#d1fae5">tax_amount = 8.0</text>
      <text x="26" y="130" class="text-label" font-size="10px" fill="#a7f3d0">Continues execution...</text>

      <text x="10" y="170" class="text-label" font-size="11px" fill="#cbd5e1"><tspan font-weight="700" fill="#34d399">3. Return &amp; Memory Freed:</tspan></text>
      <text x="10" y="186" class="text-label" font-size="11px" fill="#94a3b8">Return value delivered to</text>
      <text x="10" y="202" class="text-label" font-size="11px" fill="#94a3b8">caller. Callee stack frame is</text>
      <text x="10" y="218" class="text-label" font-size="11px" fill="#94a3b8">instantly popped from RAM!</text>
    </g>
  </g>

  <!-- Bottom Right: Stack Overflow & DRY Laws (x=780, y=405, width=375, height=305) -->
  <g transform="translate(780, 405)">
    <rect width="375" height="305" class="card-bg" stroke="#ef4444" />
    <text class="text-section" x="20" y="26" fill="#f87171">4. Stack Overflow &amp; Best Practices</text>

    <!-- Stack Overflow Trap -->
    <g transform="translate(18, 42)">
      <rect width="339" height="120" class="inner-card" stroke="#ef4444" />
      <rect x="10" y="10" width="170" height="22" rx="4" fill="#450a0a" />
      <text x="95" y="25" class="badge-text" fill="#fca5a5">CRITICAL EXCEPTION</text>

      <text x="10" y="50" class="text-val-mono" font-size="11px" font-weight="700" fill="#f87171">Stack Overflow Error:</text>
      <text x="10" y="68" class="text-label" font-size="11px" fill="#cbd5e1">Occurs when infinite recursion (a function</text>
      <text x="10" y="84" class="text-label" font-size="11px" fill="#cbd5e1">calling itself without a base exit condition)</text>
      <text x="10" y="100" class="text-label" font-size="11px" fill="#cbd5e1">pushes frames until thread stack memory exhausts.</text>
      <text x="10" y="116" class="text-label" font-size="11px" fill="#fca5a5">Symptoms: Process crash, SIGSEGV, Segmentation Fault</text>
    </g>

    <!-- DRY Principle Benefit -->
    <g transform="translate(18, 172)">
      <rect width="339" height="115" class="inner-card" stroke="#f59e0b" />
      <rect x="10" y="10" width="180" height="22" rx="4" fill="#451a03" />
      <text x="100" y="25" class="badge-text" fill="#fcd34d">THE DRY PRINCIPLE</text>

      <text x="10" y="50" class="text-val-mono" font-size="11px" font-weight="700" fill="#fcd34d">"Don't Repeat Yourself"</text>
      <text x="10" y="68" class="text-label" font-size="11px" fill="#cbd5e1">• Central Maintenance: Update formula in 1</text>
      <text x="10" y="84" class="text-label" font-size="11px" fill="#cbd5e1">  function instead of 50 copy-pasted files.</text>
      <text x="10" y="100" class="text-label" font-size="11px" fill="#cbd5e1">• Modular Unit Testing: Isolate and test each</text>
      <text x="10" y="114" class="text-label" font-size="11px" fill="#cbd5e1">  calculation independently before deploy.</text>
    </g>
  </g>
</svg>
