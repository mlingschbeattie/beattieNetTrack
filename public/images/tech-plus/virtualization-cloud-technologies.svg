<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <defs>
    <style>
      .bg { fill: #070b14; }
      .card-bg { fill: #0d1527; stroke: #1e293b; stroke-width: 1.5; rx: 10px; }
      .inner-card { fill: #111c35; stroke: #25334d; stroke-width: 1; rx: 6px; }
      .text-title { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 26px; font-weight: 700; fill: #f8fafc; }
      .text-subtitle { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 14px; fill: #94a3b8; }
      .text-section { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 13px; font-weight: 700; fill: #38bdf8; letter-spacing: 0.08em; text-transform: uppercase; }
      .text-label { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 12px; fill: #94a3b8; }
      .text-val-mono { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 11px; fill: #e2e8f0; }
      .th-mono { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; fill: #38bdf8; text-anchor: middle; }
      .layer-customer { fill: #0c4a6e; stroke: #0284c7; stroke-width: 1.5; rx: 4px; }
      .layer-provider { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 4px; }
      .text-layer { font-family: 'Segoe UI', sans-serif; font-size: 12px; font-weight: 600; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1200" height="700" class="bg" />
  <rect x="15" y="15" width="1170" height="670" rx="14" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- Title Header -->
  <g transform="translate(45, 55)">
    <text class="text-title" x="0" y="0">Virtualization &amp; Cloud Service Models</text>
    <text class="text-subtitle" x="0" y="24">Type 1 vs. Type 2 Hypervisors &amp; The Cloud Shared Responsibility Model (IaaS, PaaS, SaaS)</text>
    <rect x="0" y="38" width="1110" height="1" fill="#1e293b" />
  </g>

  <!-- Left Half: Hypervisors (Type 1 vs Type 2) -->
  <g transform="translate(45, 115)">
    <rect width="540" height="535" class="card-bg" />
    <text class="text-section" x="20" y="26">1. Hypervisor Architecture (Type 1 vs. Type 2)</text>

    <!-- Sub-Panel: Type 1 Bare-Metal -->
    <g transform="translate(20, 44)">
      <rect width="240" height="430" class="inner-card" />
      <rect x="12" y="12" width="216" height="28" fill="#0369a1" rx="4" />
      <text x="120" y="31" class="th-mono" fill="#ffffff">Type 1: Bare-Metal</text>

      <!-- VMs -->
      <g transform="translate(15, 50)">
        <!-- VM 1 -->
        <rect width="100" height="60" fill="#064e3b" stroke="#059669" rx="4" />
        <text x="50" y="22" class="text-val-mono" fill="#34d399" text-anchor="middle" font-weight="700">VM 1 (App)</text>
        <rect x="6" y="30" width="88" height="22" fill="#022c22" rx="3" />
        <text x="50" y="45" class="text-val-mono" fill="#6ee7b7" text-anchor="middle" font-size="9.5px">Guest OS</text>

        <!-- VM 2 -->
        <rect x="110" width="100" height="60" fill="#064e3b" stroke="#059669" rx="4" />
        <text x="160" y="22" class="text-val-mono" fill="#34d399" text-anchor="middle" font-weight="700">VM 2 (App)</text>
        <rect x="116" y="30" width="88" height="22" fill="#022c22" rx="3" />
        <text x="160" y="45" class="text-val-mono" fill="#6ee7b7" text-anchor="middle" font-size="9.5px">Guest OS</text>
      </g>

      <!-- Hypervisor Layer -->
      <rect x="15" y="122" width="210" height="82" fill="#0f2b48" stroke="#0284c7" stroke-width="2" rx="5" />
      <text x="120" y="145" class="text-val-mono" fill="#38bdf8" text-anchor="middle" font-size="13px" font-weight="700">Type 1 Hypervisor</text>
      <text x="120" y="165" class="text-label" text-anchor="middle" fill="#93c5fd" font-size="11px">Installs directly on raw metal</text>
      <text x="120" y="186" class="text-val-mono" text-anchor="middle" fill="#7dd3fc" font-size="9.5px">VMware ESXi / Proxmox / Hyper-V</text>

      <!-- Hardware Layer -->
      <rect x="15" y="214" width="210" height="82" fill="#1e293b" stroke="#475569" rx="5" />
      <text x="120" y="238" class="text-val-mono" fill="#f8fafc" text-anchor="middle" font-size="12px" font-weight="700">Physical Server Hardware</text>
      <text x="120" y="258" class="text-label" text-anchor="middle" font-size="11px">Enterprise CPUs, ECC RAM, NVMe</text>
      <text x="120" y="278" class="text-label" text-anchor="middle" font-size="11px">Redundant Power &amp; 10GbE NICs</text>

      <!-- Badge -->
      <rect x="15" y="306" width="210" height="110" fill="#070f1e" rx="5" stroke="#1e293b" />
      <text x="25" y="328" class="text-val-mono" fill="#34d399" font-weight="700" font-size="11px">Key Characteristics:</text>
      <text x="25" y="348" class="text-label" fill="#cbd5e1" font-size="11px">• Near zero latency overhead</text>
      <text x="25" y="368" class="text-label" fill="#cbd5e1" font-size="11px">• Maximum hardware efficiency</text>
      <text x="25" y="388" class="text-label" fill="#cbd5e1" font-size="11px">• Standard for enterprise cloud</text>
    </g>

    <!-- Sub-Panel: Type 2 Hosted -->
    <g transform="translate(280, 44)">
      <rect width="240" height="430" class="inner-card" />
      <rect x="12" y="12" width="216" height="28" fill="#d97706" rx="4" />
      <text x="120" y="31" class="th-mono" fill="#ffffff">Type 2: Hosted</text>

      <!-- VMs -->
      <g transform="translate(15, 50)">
        <!-- VM 1 -->
        <rect width="100" height="52" fill="#064e3b" stroke="#059669" rx="4" />
        <text x="50" y="20" class="text-val-mono" fill="#34d399" text-anchor="middle" font-weight="700">VM 1 (App)</text>
        <rect x="6" y="26" width="88" height="20" fill="#022c22" rx="3" />
        <text x="50" y="40" class="text-val-mono" fill="#6ee7b7" text-anchor="middle" font-size="9.5px">Guest OS</text>

        <!-- VM 2 -->
        <rect x="110" width="100" height="52" fill="#064e3b" stroke="#059669" rx="4" />
        <text x="160" y="20" class="text-val-mono" fill="#34d399" text-anchor="middle" font-weight="700">VM 2 (App)</text>
        <rect x="116" y="26" width="88" height="20" fill="#022c22" rx="3" />
        <text x="160" y="40" class="text-val-mono" fill="#6ee7b7" text-anchor="middle" font-size="9.5px">Guest OS</text>
      </g>

      <!-- Type 2 Hypervisor App Layer -->
      <rect x="15" y="112" width="210" height="62" fill="#311e08" stroke="#d97706" stroke-width="1.5" rx="5" />
      <text x="120" y="133" class="text-val-mono" fill="#fbbf24" text-anchor="middle" font-size="12px" font-weight="700">Type 2 Hypervisor (App)</text>
      <text x="120" y="153" class="text-val-mono" text-anchor="middle" fill="#fde68a" font-size="9.5px">VirtualBox / VMware Workstation</text>

      <!-- Host OS Layer -->
      <rect x="15" y="184" width="210" height="54" fill="#1c162e" stroke="#7c3aed" rx="5" />
      <text x="120" y="206" class="text-val-mono" fill="#c084fc" text-anchor="middle" font-size="12px" font-weight="700">Host Operating System</text>
      <text x="120" y="224" class="text-label" text-anchor="middle" font-size="11px">Windows 11 / macOS / Ubuntu</text>

      <!-- Physical Hardware Layer -->
      <rect x="15" y="248" width="210" height="48" fill="#1e293b" stroke="#475569" rx="5" />
      <text x="120" y="270" class="text-val-mono" fill="#f8fafc" text-anchor="middle" font-size="12px" font-weight="700">Client PC / Laptop</text>
      <text x="120" y="286" class="text-label" text-anchor="middle" font-size="10px">Standard Desktop Hardware</text>

      <!-- Badge -->
      <rect x="15" y="306" width="210" height="110" fill="#070f1e" rx="5" stroke="#1e293b" />
      <text x="25" y="328" class="text-val-mono" fill="#fbbf24" font-weight="700" font-size="11px">Key Characteristics:</text>
      <text x="25" y="348" class="text-label" fill="#cbd5e1" font-size="11px">• Runs inside a standard desktop OS</text>
      <text x="25" y="368" class="text-label" fill="#cbd5e1" font-size="11px">• Host OS adds performance penalty</text>
      <text x="25" y="388" class="text-label" fill="#cbd5e1" font-size="11px">• Best for dev, lab testing &amp; learning</text>
    </g>

    <text x="20" y="512" class="text-label" fill="#94a3b8">Exam Key: Type 1 installs on raw silicon; Type 2 requires a pre-installed host OS.</text>
  </g>

  <!-- Right Half: Cloud Shared Responsibility Matrix (IaaS, PaaS, SaaS) -->
  <g transform="translate(615, 115)">
    <rect width="540" height="535" class="card-bg" />
    <text class="text-section" x="20" y="26">2. Cloud Service Models: Shared Responsibility</text>

    <!-- Legend -->
    <g transform="translate(20, 38)">
      <rect x="0" y="0" width="16" height="14" rx="3" fill="#0284c7" />
      <text x="24" y="11" class="text-val-mono" fill="#38bdf8">Customer Responsibility</text>

      <rect x="230" y="0" width="16" height="14" rx="3" fill="#334155" />
      <text x="254" y="11" class="text-val-mono" fill="#94a3b8">Cloud Provider Responsibility</text>
    </g>

    <!-- Matrix Stack Table -->
    <g transform="translate(20, 64)">
      <!-- Column Headers -->
      <rect x="175" y="0" width="102" height="26" fill="#0f2b48" rx="4" />
      <text x="226" y="18" class="th-mono" font-size="12px">IaaS</text>

      <rect x="287" y="0" width="102" height="26" fill="#0f2b48" rx="4" />
      <text x="338" y="18" class="th-mono" font-size="12px">PaaS</text>

      <rect x="399" y="0" width="102" height="26" fill="#0f2b48" rx="4" />
      <text x="450" y="18" class="th-mono" font-size="12px">SaaS</text>

      <!-- 9 Stack Rows (width = 165 for label, width = 102 for columns) -->
      <!-- 1. Applications -->
      <g transform="translate(0, 32)">
        <rect width="165" height="34" class="inner-card" />
        <text x="10" y="22" class="text-val-mono" font-weight="700">1. Applications</text>
        <rect x="175" width="102" height="34" class="layer-customer" /><text x="226" y="22" class="text-layer" fill="#38bdf8">Customer</text>
        <rect x="287" width="102" height="34" class="layer-customer" /><text x="338" y="22" class="text-layer" fill="#38bdf8">Customer</text>
        <rect x="399" width="102" height="34" class="layer-provider" /><text x="450" y="22" class="text-layer" fill="#94a3b8">Provider</text>
      </g>

      <!-- 2. Data & Access -->
      <g transform="translate(0, 70)">
        <rect width="165" height="34" class="inner-card" />
        <text x="10" y="22" class="text-val-mono" font-weight="700">2. Data &amp; Access</text>
        <rect x="175" width="102" height="34" class="layer-customer" /><text x="226" y="22" class="text-layer" fill="#38bdf8">Customer</text>
        <rect x="287" width="102" height="34" class="layer-customer" /><text x="338" y="22" class="text-layer" fill="#38bdf8">Customer</text>
        <rect x="399" width="102" height="34" class="layer-customer" stroke="#0ea5e9" /><text x="450" y="22" class="text-layer" fill="#38bdf8">Customer</text>
      </g>

      <!-- 3. Runtime -->
      <g transform="translate(0, 108)">
        <rect width="165" height="34" class="inner-card" />
        <text x="10" y="22" class="text-val-mono" font-weight="700">3. Runtime</text>
        <rect x="175" width="102" height="34" class="layer-customer" /><text x="226" y="22" class="text-layer" fill="#38bdf8">Customer</text>
        <rect x="287" width="102" height="34" class="layer-provider" /><text x="338" y="22" class="text-layer" fill="#94a3b8">Provider</text>
        <rect x="399" width="102" height="34" class="layer-provider" /><text x="450" y="22" class="text-layer" fill="#94a3b8">Provider</text>
      </g>

      <!-- 4. Middleware -->
      <g transform="translate(0, 146)">
        <rect width="165" height="34" class="inner-card" />
        <text x="10" y="22" class="text-val-mono" font-weight="700">4. Middleware</text>
        <rect x="175" width="102" height="34" class="layer-customer" /><text x="226" y="22" class="text-layer" fill="#38bdf8">Customer</text>
        <rect x="287" width="102" height="34" class="layer-provider" /><text x="338" y="22" class="text-layer" fill="#94a3b8">Provider</text>
        <rect x="399" width="102" height="34" class="layer-provider" /><text x="450" y="22" class="text-layer" fill="#94a3b8">Provider</text>
      </g>

      <!-- 5. Operating System -->
      <g transform="translate(0, 184)">
        <rect width="165" height="34" class="inner-card" />
        <text x="10" y="22" class="text-val-mono" font-weight="700">5. Operating System</text>
        <rect x="175" width="102" height="34" class="layer-customer" /><text x="226" y="22" class="text-layer" fill="#38bdf8">Customer</text>
        <rect x="287" width="102" height="34" class="layer-provider" /><text x="338" y="22" class="text-layer" fill="#94a3b8">Provider</text>
        <rect x="399" width="102" height="34" class="layer-provider" /><text x="450" y="22" class="text-layer" fill="#94a3b8">Provider</text>
      </g>

      <!-- 6. Virtualization -->
      <g transform="translate(0, 222)">
        <rect width="165" height="34" class="inner-card" />
        <text x="10" y="22" class="text-val-mono" font-weight="700">6. Virtualization</text>
        <rect x="175" width="102" height="34" class="layer-provider" /><text x="226" y="22" class="text-layer" fill="#94a3b8">Provider</text>
        <rect x="287" width="102" height="34" class="layer-provider" /><text x="338" y="22" class="text-layer" fill="#94a3b8">Provider</text>
        <rect x="399" width="102" height="34" class="layer-provider" /><text x="450" y="22" class="text-layer" fill="#94a3b8">Provider</text>
      </g>

      <!-- 7. Physical Servers -->
      <g transform="translate(0, 260)">
        <rect width="165" height="34" class="inner-card" />
        <text x="10" y="22" class="text-val-mono" font-weight="700">7. Physical Servers</text>
        <rect x="175" width="102" height="34" class="layer-provider" /><text x="226" y="22" class="text-layer" fill="#94a3b8">Provider</text>
        <rect x="287" width="102" height="34" class="layer-provider" /><text x="338" y="22" class="text-layer" fill="#94a3b8">Provider</text>
        <rect x="399" width="102" height="34" class="layer-provider" /><text x="450" y="22" class="text-layer" fill="#94a3b8">Provider</text>
      </g>

      <!-- 8. Storage Hardware -->
      <g transform="translate(0, 298)">
        <rect width="165" height="34" class="inner-card" />
        <text x="10" y="22" class="text-val-mono" font-weight="700">8. Storage Hardware</text>
        <rect x="175" width="102" height="34" class="layer-provider" /><text x="226" y="22" class="text-layer" fill="#94a3b8">Provider</text>
        <rect x="287" width="102" height="34" class="layer-provider" /><text x="338" y="22" class="text-layer" fill="#94a3b8">Provider</text>
        <rect x="399" width="102" height="34" class="layer-provider" /><text x="450" y="22" class="text-layer" fill="#94a3b8">Provider</text>
      </g>

      <!-- 9. Physical Network -->
      <g transform="translate(0, 336)">
        <rect width="165" height="34" class="inner-card" />
        <text x="10" y="22" class="text-val-mono" font-weight="700">9. Networking / DC</text>
        <rect x="175" width="102" height="34" class="layer-provider" /><text x="226" y="22" class="text-layer" fill="#94a3b8">Provider</text>
        <rect x="287" width="102" height="34" class="layer-provider" /><text x="338" y="22" class="text-layer" fill="#94a3b8">Provider</text>
        <rect x="399" width="102" height="34" class="layer-provider" /><text x="450" y="22" class="text-layer" fill="#94a3b8">Provider</text>
      </g>

      <!-- Examples row -->
      <g transform="translate(0, 376)">
        <rect width="165" height="42" class="inner-card" />
        <text x="10" y="26" class="text-label" font-weight="700" fill="#38bdf8">Real Examples:</text>
        <rect x="175" width="102" height="42" fill="#071324" rx="4" />
        <text x="226" y="18" class="text-label" text-anchor="middle" fill="#cbd5e1" font-size="11px">AWS EC2</text>
        <text x="226" y="32" class="text-label" text-anchor="middle" fill="#cbd5e1" font-size="11px">Azure VMs</text>

        <rect x="287" width="102" height="42" fill="#071324" rx="4" />
        <text x="338" y="18" class="text-label" text-anchor="middle" fill="#cbd5e1" font-size="11px">AWS Beanstalk</text>
        <text x="338" y="32" class="text-label" text-anchor="middle" fill="#cbd5e1" font-size="11px">Heroku</text>

        <rect x="399" width="102" height="42" fill="#071324" rx="4" />
        <text x="450" y="18" class="text-label" text-anchor="middle" fill="#cbd5e1" font-size="11px">Microsoft 365</text>
        <text x="450" y="32" class="text-label" text-anchor="middle" fill="#cbd5e1" font-size="11px">Google Workspace</text>
      </g>
    </g>

    <text x="20" y="512" class="text-label" fill="#94a3b8">Rule: In SaaS you manage zero infrastructure; in IaaS you manage OS and up.</text>
  </g>
</svg>
