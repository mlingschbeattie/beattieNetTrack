<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740">
  <defs>
    <style>
      .bg { fill: #070b14; }
      .card-bg { fill: #0d1527; stroke: #1e293b; stroke-width: 1.5; rx: 10px; }
      .inner-card { fill: #111c35; stroke: #25334d; stroke-width: 1; rx: 6px; }
      .text-title { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 26px; font-weight: 700; fill: #f8fafc; }
      .text-subtitle { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 14px; fill: #94a3b8; }
      .text-section { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
      .text-label { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 12px; fill: #94a3b8; }
      .text-val-mono { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 11px; fill: #e2e8f0; }
      .badge-text { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; text-anchor: middle; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="740" class="bg" />
  <rect x="15" y="15" width="1170" height="710" rx="14" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- Title Header -->
  <g transform="translate(45, 55)">
    <text class="text-title" x="0" y="0">Cryptographic Foundations: Symmetric vs. Asymmetric</text>
    <text class="text-subtitle" x="0" y="24">Shared Secret Bulk Encryption vs. Public Key Infrastructure &amp; Hybrid Handshakes (FC0-U71 6.1, 6.4)</text>
    <rect x="0" y="38" width="1110" height="1" fill="#1e293b" />
  </g>

  <!-- Top Panel: Symmetric vs Asymmetric Comparison (x=45, y=115, width=1110, height=310) -->
  <g transform="translate(45, 115)">
    <rect width="1110" height="310" class="card-bg" stroke="#0284c7" />
    <text class="text-section" x="20" y="24" fill="#38bdf8">1. Encryption Architectures: Symmetric (Shared Secret) vs. Asymmetric (Key Pairs)</text>
    <text class="text-label" text-anchor="end" x="1090" y="24">CompTIA Tech+ (FC0-U71) Objectives 6.1 &amp; 6.4</text>

    <!-- Left Box: Symmetric Encryption (x=20, width=525) -->
    <g transform="translate(20, 36)">
      <rect width="525" height="258" class="inner-card" stroke="#f59e0b" />
      <rect x="12" y="10" width="190" height="22" rx="4" fill="#451a03" />
      <text x="107" y="25" class="badge-text" fill="#fcd34d">1. SYMMETRIC ENCRYPTION</text>
      <text x="212" y="25" class="text-label" fill="#fde68a">Single Shared Secret Key</text>

      <!-- Architecture Pipeline -->
      <rect x="12" y="38" width="501" height="66" rx="4" fill="#070b14" stroke="#1e293b" />
      <rect x="20" y="48" width="105" height="46" rx="3" fill="#111c35" stroke="#3b82f6" />
      <text x="72" y="66" class="badge-text" fill="#93c5fd">PLAINTEXT</text>
      <text x="72" y="82" class="text-val-mono" font-size="9px" text-anchor="middle" fill="#cbd5e1">"Secret Doc"</text>

      <path d="M 130 71 L 155 71" stroke="#38bdf8" stroke-width="2" marker-end="none" />
      <polygon points="155,67 163,71 155,75" fill="#38bdf8" />

      <rect x="168" y="48" width="165" height="46" rx="3" fill="#451a03" stroke="#f59e0b" />
      <text x="250" y="66" class="badge-text" fill="#fcd34d">AES-256 CIPHER</text>
      <text x="250" y="82" class="text-val-mono" font-size="9px" text-anchor="middle" fill="#fde68a">Shared Key (K)</text>

      <path d="M 338 71 L 363 71" stroke="#38bdf8" stroke-width="2" />
      <polygon points="363,67 371,71 363,75" fill="#38bdf8" />

      <rect x="376" y="48" width="125" height="46" rx="3" fill="#111c35" stroke="#10b981" />
      <text x="438" y="66" class="badge-text" fill="#34d399">CIPHERTEXT</text>
      <text x="438" y="82" class="text-val-mono" font-size="9px" text-anchor="middle" fill="#a7f3d0">3f9a8b1c4e7d...</text>

      <!-- Technical Properties -->
      <rect x="12" y="112" width="501" height="132" rx="4" fill="#070b14" stroke="#1e293b" />
      <text x="18" y="132" class="text-val-mono" font-size="11px" font-weight="700" fill="#fcd34d">Technical Mechanism &amp; Standards:</text>
      <text x="18" y="150" class="text-label" font-size="10.5px" fill="#cbd5e1">• Single Key: The exact same key encrypts and decrypts the data.</text>
      <text x="18" y="168" class="text-label" font-size="10.5px" fill="#cbd5e1">• Hardware Speed: Ultra-fast AES-NI CPU registers; ideal for bulk data.</text>
      <text x="18" y="186" class="text-label" font-size="10.5px" fill="#cbd5e1">• Production Standard: AES-256 (BitLocker, FileVault, WPA3, TLS pipe).</text>
      <text x="18" y="206" class="text-val-mono" font-size="10.5px" fill="#f87171">Key Flaw: Secure initial key exchange over public networks is difficult.</text>
      <text x="18" y="226" class="text-label" font-size="10px" fill="#94a3b8">If an attacker intercepts the shared key, all encrypted data is compromised.</text>
    </g>

    <!-- Right Box: Asymmetric Encryption (x=565, width=525) -->
    <g transform="translate(565, 36)">
      <rect width="525" height="258" class="inner-card" stroke="#38bdf8" />
      <rect x="12" y="10" width="200" height="22" rx="4" fill="#0c2340" />
      <text x="112" y="25" class="badge-text" fill="#38bdf8">2. ASYMMETRIC ENCRYPTION</text>
      <text x="222" y="25" class="text-label" fill="#93c5fd">Public &amp; Private Key Pair</text>

      <!-- Architecture Pipeline -->
      <rect x="12" y="38" width="501" height="66" rx="4" fill="#070b14" stroke="#1e293b" />
      <rect x="20" y="48" width="105" height="46" rx="3" fill="#111c35" stroke="#3b82f6" />
      <text x="72" y="66" class="badge-text" fill="#93c5fd">PLAINTEXT</text>
      <text x="72" y="82" class="text-val-mono" font-size="9px" text-anchor="middle" fill="#cbd5e1">"Session Key"</text>

      <path d="M 130 71 L 155 71" stroke="#38bdf8" stroke-width="2" />
      <polygon points="155,67 163,71 155,75" fill="#38bdf8" />

      <rect x="168" y="48" width="165" height="46" rx="3" fill="#0c2340" stroke="#38bdf8" />
      <text x="250" y="66" class="badge-text" fill="#38bdf8">ENCRYPT: PUBLIC KEY</text>
      <text x="250" y="82" class="text-val-mono" font-size="9px" text-anchor="middle" fill="#93c5fd">Shared with Everyone</text>

      <path d="M 338 71 L 363 71" stroke="#38bdf8" stroke-width="2" />
      <polygon points="363,67 371,71 363,75" fill="#38bdf8" />

      <rect x="376" y="48" width="125" height="46" rx="3" fill="#111c35" stroke="#ec4899" />
      <text x="438" y="66" class="badge-text" fill="#f472b6">DECRYPT: PRIVATE</text>
      <text x="438" y="82" class="text-val-mono" font-size="9px" text-anchor="middle" fill="#fbcfe8">Recipient Only</text>

      <!-- Technical Properties -->
      <rect x="12" y="112" width="501" height="132" rx="4" fill="#070b14" stroke="#1e293b" />
      <text x="18" y="132" class="text-val-mono" font-size="11px" font-weight="700" fill="#38bdf8">Technical Mechanism &amp; Standards:</text>
      <text x="18" y="150" class="text-label" font-size="10.5px" fill="#cbd5e1">• Key Pair: Data encrypted with Public Key can ONLY be decrypted by Private.</text>
      <text x="18" y="168" class="text-label" font-size="10.5px" fill="#cbd5e1">• Key Exchange: Solves the distribution flaw; Public Key is freely shared.</text>
      <text x="18" y="186" class="text-label" font-size="10.5px" fill="#cbd5e1">• Production Standard: RSA (3072-bit), ECC (ECDSA, Ed25519).</text>
      <text x="18" y="206" class="text-val-mono" font-size="10.5px" fill="#fcd34d">Limitation: Computationally expensive; ~1000x slower than symmetric math.</text>
      <text x="18" y="226" class="text-label" font-size="10px" fill="#94a3b8">Technician Rule: Never use asymmetric ciphers for bulk file or drive encryption!</text>
    </g>
  </g>

  <!-- Bottom Panel: Modern Hybrid Cryptography (x=45, y=440, width=1110, height=275) -->
  <g transform="translate(45, 440)">
    <rect width="1110" height="275" class="card-bg" stroke="#10b981" />
    <text class="text-section" x="20" y="24" fill="#34d399">2. Modern Hybrid Cryptography: How TLS 1.3 &amp; HTTPS Secure the Web</text>
    <text class="text-label" text-anchor="end" x="1090" y="24">Production Transport Encryption</text>

    <!-- Step 1: Handshake & Identity -->
    <g transform="translate(20, 38)">
      <rect width="345" height="152" class="inner-card" stroke="#38bdf8" />
      <rect x="10" y="10" width="130" height="20" rx="3" fill="#0c2340" />
      <text x="75" y="24" class="badge-text" fill="#38bdf8">STEP 1: IDENTITY</text>
      <text x="148" y="24" class="text-label" font-size="11px" fill="#93c5fd">CA Trust Chain</text>

      <rect x="10" y="36" width="325" height="104" rx="4" fill="#070b14" stroke="#1e293b" />
      <text x="16" y="54" class="text-val-mono" font-size="10.5px" font-weight="700" fill="#38bdf8">Certificate Verification:</text>
      <text x="16" y="72" class="text-label" font-size="10.5px" fill="#cbd5e1">• Web browser connects to https://server.</text>
      <text x="16" y="90" class="text-label" font-size="10.5px" fill="#cbd5e1">• Server presents X.509 Digital Certificate.</text>
      <text x="16" y="108" class="text-label" font-size="10.5px" fill="#cbd5e1">• Client verifies CA signature with Root Store.</text>
      <text x="16" y="126" class="text-val-mono" font-size="10px" fill="#34d399">Confirms server identity before exchanging data.</text>
    </g>

    <!-- Step 2: Asymmetric Key Exchange -->
    <g transform="translate(380, 38)">
      <rect width="345" height="152" class="inner-card" stroke="#8b5cf6" />
      <rect x="10" y="10" width="145" height="20" rx="3" fill="#2e1065" />
      <text x="82" y="24" class="badge-text" fill="#c084fc">STEP 2: KEY EXCHANGE</text>
      <text x="162" y="24" class="text-label" font-size="11px" fill="#ddd6fe">Ephemeral ECDHE</text>

      <rect x="10" y="36" width="325" height="104" rx="4" fill="#070b14" stroke="#1e293b" />
      <text x="16" y="54" class="text-val-mono" font-size="10.5px" font-weight="700" fill="#c084fc">Secure Session Negotiation:</text>
      <text x="16" y="72" class="text-label" font-size="10.5px" fill="#cbd5e1">• Client &amp; Server execute ECDHE exchange.</text>
      <text x="16" y="90" class="text-label" font-size="10.5px" fill="#cbd5e1">• Math generates a temporary session key.</text>
      <text x="16" y="108" class="text-label" font-size="10.5px" fill="#cbd5e1">• Private key never traverses the Internet wire!</text>
      <text x="16" y="126" class="text-val-mono" font-size="10px" fill="#c084fc">Perfect Forward Secrecy (PFS) enforced.</text>
    </g>

    <!-- Step 3: Symmetric Bulk Transfer -->
    <g transform="translate(740, 38)">
      <rect width="350" height="152" class="inner-card" stroke="#10b981" />
      <rect x="10" y="10" width="140" height="20" rx="3" fill="#064e3b" />
      <text x="80" y="24" class="badge-text" fill="#34d399">STEP 3: BULK TUNNEL</text>
      <text x="158" y="24" class="text-label" font-size="11px" fill="#a7f3d0">AES-256-GCM Speed</text>

      <rect x="10" y="36" width="330" height="104" rx="4" fill="#070b14" stroke="#1e293b" />
      <text x="16" y="54" class="text-val-mono" font-size="10.5px" font-weight="700" fill="#34d399">Ultra-Fast Data Transmission:</text>
      <text x="16" y="72" class="text-label" font-size="10.5px" fill="#cbd5e1">• Both ends switch to the negotiated secret key.</text>
      <text x="16" y="90" class="text-label" font-size="10.5px" fill="#cbd5e1">• Bulk HTTP web traffic streams via AES-256.</text>
      <text x="16" y="108" class="text-label" font-size="10.5px" fill="#cbd5e1">• CPU hardware achieves multi-gigabit throughput.</text>
      <text x="16" y="126" class="text-val-mono" font-size="10px" fill="#38bdf8">Session key destroyed when connection closes.</text>
    </g>

    <!-- Summary Banner -->
    <rect x="20" y="200" width="1070" height="60" rx="4" fill="#070b14" stroke="#1e293b" />
    <text x="32" y="224" class="text-val-mono" font-size="11px" font-weight="700" fill="#34d399">Architectural Takeaway (Best of Both Worlds):</text>
    <text x="32" y="244" class="text-label" font-size="11px" fill="#cbd5e1">Asymmetric encryption solves key exchange and identity authentication. Symmetric encryption provides high-speed bulk confidentiality.</text>
  </g>
</svg>
