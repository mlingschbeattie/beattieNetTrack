<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #070b14; }
      .card-bg { fill: #0d1527; stroke: #1e293b; stroke-width: 1.5; rx: 10px; }
      .step-card { fill: #111c35; stroke: #25334d; stroke-width: 1.5; rx: 8px; }
      .text-title { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 26px; font-weight: 700; fill: #f8fafc; }
      .text-subtitle { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 14px; fill: #94a3b8; }
      .step-num { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 800; }
      .step-name { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #f8fafc; }
      .step-detail { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 12px; fill: #cbd5e1; }
      .step-sub { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 11px; fill: #94a3b8; }
      .arrow { stroke: #38bdf8; stroke-width: 2; fill: none; }
      .arrow-head { fill: #38bdf8; }
      .loop-arrow { stroke: #f43f5e; stroke-width: 1.5; stroke-dasharray: 4 4; fill: none; }
    </style>
  </defs>

  <rect width="1200" height="680" class="bg" />
  <rect x="15" y="15" width="1170" height="650" rx="14" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- Title Header -->
  <g transform="translate(45, 55)">
    <text class="text-title" x="0" y="0">CompTIA 6-Step Troubleshooting Methodology</text>
    <text class="text-subtitle" x="0" y="24">Standard Enterprise IT Diagnostic Lifecycle — CompTIA FC0-U71 Core Objective 1.4</text>
    <rect x="0" y="38" width="1110" height="1" fill="#1e293b" />
  </g>

  <!-- Flowchart Row 1: Steps 1, 2, 3 -->
  <!-- Step 1 -->
  <g transform="translate(65, 125)">
    <rect width="320" height="195" class="step-card" />
    <rect x="15" y="15" width="70" height="24" rx="4" fill="#0369a1" />
    <text x="50" y="31" class="step-num" fill="#ffffff" text-anchor="middle">STEP 1</text>
    <text x="15" y="65" class="step-name">Identify the Problem</text>
    <text x="15" y="92" class="step-detail">• Question the user &amp; identify symptoms</text>
    <text x="15" y="112" class="step-detail">• Inquire about environmental / system changes</text>
    <text x="15" y="132" class="step-detail">• Duplicate the problem if possible</text>
    <rect x="15" y="148" width="290" height="32" fill="#070d1a" rx="4" stroke="#0ea5e9" stroke-width="0.8" />
    <text x="25" y="169" class="step-sub" fill="#38bdf8" font-weight="600">CRITICAL: Perform backup before changes</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <g transform="translate(385, 222)">
    <path d="M 0 0 L 50 0" class="arrow" />
    <polygon points="58,0 48,-5 48,5" class="arrow-head" />
  </g>

  <!-- Step 2 -->
  <g transform="translate(445, 125)">
    <rect width="320" height="195" class="step-card" />
    <rect x="15" y="15" width="70" height="24" rx="4" fill="#0284c7" />
    <text x="50" y="31" class="step-num" fill="#ffffff" text-anchor="middle">STEP 2</text>
    <text x="15" y="65" class="step-name">Establish Theory of Cause</text>
    <text x="15" y="92" class="step-detail">• Question the obvious (cables, power, Wi-Fi)</text>
    <text x="15" y="112" class="step-detail">• Consider multiple approaches</text>
    <text x="15" y="132" class="step-detail">• Top-to-bottom / divide-and-conquer OSI model</text>
    <rect x="15" y="148" width="290" height="32" fill="#070d1a" rx="4" stroke="#38bdf8" stroke-width="0.8" />
    <text x="25" y="169" class="step-sub" fill="#38bdf8" font-weight="600">Prioritize most probable causes first</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <g transform="translate(765, 222)">
    <path d="M 0 0 L 50 0" class="arrow" />
    <polygon points="58,0 48,-5 48,5" class="arrow-head" />
  </g>

  <!-- Step 3 -->
  <g transform="translate(825, 125)">
    <rect width="320" height="195" class="step-card" />
    <rect x="15" y="15" width="70" height="24" rx="4" fill="#0d9488" />
    <text x="50" y="31" class="step-num" fill="#ffffff" text-anchor="middle">STEP 3</text>
    <text x="15" y="65" class="step-name">Test the Theory</text>
    <text x="15" y="92" class="step-detail">• Test your hypothesis in isolation</text>
    <text x="15" y="112" class="step-detail">• If confirmed: proceed to Step 4</text>
    <text x="15" y="132" class="step-detail">• If NOT confirmed: form new theory or escalate</text>
    <rect x="15" y="148" width="290" height="32" fill="#1f101b" rx="4" stroke="#f43f5e" stroke-width="0.8" />
    <text x="25" y="169" class="step-sub" fill="#fb7185" font-weight="600">Loop back to Step 2 if test fails</text>
  </g>

  <!-- Downward Transition Arrow 3 -> 4 -->
  <g transform="translate(985, 320)">
    <path d="M 0 0 L 0 55 L -10 55" class="arrow" />
    <polygon points="-18,55 -8,50 -8,60" class="arrow-head" />
  </g>

  <!-- Flowchart Row 2: Steps 6, 5, 4 (reverse flow for intuitive loop) -->
  <!-- Step 4 -->
  <g transform="translate(825, 385)">
    <rect width="320" height="195" class="step-card" />
    <rect x="15" y="15" width="70" height="24" rx="4" fill="#16a34a" />
    <text x="50" y="31" class="step-num" fill="#ffffff" text-anchor="middle">STEP 4</text>
    <text x="15" y="65" class="step-name">Plan Action &amp; Implement</text>
    <text x="15" y="92" class="step-detail">• Establish plan of action with steps</text>
    <text x="15" y="112" class="step-detail">• Identify potential side effects &amp; risks</text>
    <text x="15" y="132" class="step-detail">• Implement solution or escalate if needed</text>
    <rect x="15" y="148" width="290" height="32" fill="#091c13" rx="4" stroke="#22c55e" stroke-width="0.8" />
    <text x="25" y="169" class="step-sub" fill="#4ade80" font-weight="600">Adhere to corporate change control policies</text>
  </g>

  <!-- Arrow 4 -> 5 (leftwards) -->
  <g transform="translate(825, 482)">
    <path d="M 0 0 L -50 0" class="arrow" />
    <polygon points="-58,0 -48,-5 -48,5" class="arrow-head" />
  </g>

  <!-- Step 5 -->
  <g transform="translate(445, 385)">
    <rect width="320" height="195" class="step-card" />
    <rect x="15" y="15" width="70" height="24" rx="4" fill="#d97706" />
    <text x="50" y="31" class="step-num" fill="#ffffff" text-anchor="middle">STEP 5</text>
    <text x="15" y="65" class="step-name">Verify &amp; Prevent</text>
    <text x="15" y="92" class="step-detail">• Verify full system functionality with user</text>
    <text x="15" y="112" class="step-detail">• Ensure no secondary issues were created</text>
    <text x="15" y="132" class="step-detail">• Implement preventive measures</text>
    <rect x="15" y="148" width="290" height="32" fill="#1c1608" rx="4" stroke="#f59e0b" stroke-width="0.8" />
    <text x="25" y="169" class="step-sub" fill="#fbbf24" font-weight="600">Install patches, train users, configure alerts</text>
  </g>

  <!-- Arrow 5 -> 6 (leftwards) -->
  <g transform="translate(445, 482)">
    <path d="M 0 0 L -50 0" class="arrow" />
    <polygon points="-58,0 -48,-5 -48,5" class="arrow-head" />
  </g>

  <!-- Step 6 -->
  <g transform="translate(65, 385)">
    <rect width="320" height="195" class="step-card" />
    <rect x="15" y="15" width="70" height="24" rx="4" fill="#7c3aed" />
    <text x="50" y="31" class="step-num" fill="#ffffff" text-anchor="middle">STEP 6</text>
    <text x="15" y="65" class="step-name">Document Everything</text>
    <text x="15" y="92" class="step-detail">• Record initial problem symptoms</text>
    <text x="15" y="112" class="step-detail">• Document exact actions taken &amp; solutions</text>
    <text x="15" y="132" class="step-detail">• Update internal knowledge base &amp; ticket</text>
    <rect x="15" y="148" width="290" height="32" fill="#160e28" rx="4" stroke="#8b5cf6" stroke-width="0.8" />
    <text x="25" y="169" class="step-sub" fill="#c084fc" font-weight="600">The fix is not complete until documented</text>
  </g>

  <!-- Bottom Legend -->
  <text x="65" y="625" font-family="'JetBrains Mono', monospace" font-size="12px" fill="#64748b">
    RULE OF THUMB: Step 1 (Identify + Backup) ➔ Step 2 (Theory) ➔ Step 3 (Test) ➔ Step 4 (Plan &amp; Fix) ➔ Step 5 (Verify &amp; Prevent) ➔ Step 6 (Document).
  </text>
</svg>
