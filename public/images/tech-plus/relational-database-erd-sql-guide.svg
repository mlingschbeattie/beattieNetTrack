<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #070b14; }
      .card-bg { fill: #0d1527; stroke: #1e293b; stroke-width: 1.5; rx: 10px; }
      .inner-card { fill: #111c35; stroke: #25334d; stroke-width: 1; rx: 6px; }
      .text-title { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 26px; font-weight: 700; fill: #f8fafc; }
      .text-subtitle { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 14px; fill: #94a3b8; }
      .text-section { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
      .text-label { font-family: 'Segoe UI', -apple-system, sans-serif; font-size: 12px; fill: #94a3b8; }
      .text-val-mono { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 12px; fill: #e2e8f0; }
      .badge-text { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; text-anchor: middle; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="740" class="bg" />
  <rect x="15" y="15" width="1170" height="710" rx="14" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- Title Header -->
  <g transform="translate(45, 55)">
    <text class="text-title" x="0" y="0">Relational Database Architecture &amp; SQL Query Guide</text>
    <text class="text-subtitle" x="0" y="24">Entity-Relationship Modeling (ERD), Primary &amp; Foreign Keys, 1:N Cardinality, and CRUD Operations</text>
    <rect x="0" y="38" width="1110" height="1" fill="#1e293b" />
  </g>

  <!-- Top Panel: ERD Topology & Relational Tables (x=45, y=115, width=1110, height=330) -->
  <g transform="translate(45, 115)">
    <rect width="1110" height="330" class="card-bg" stroke="#0284c7" />
    <text class="text-section" x="20" y="24" fill="#38bdf8">1. Entity-Relationship Model: Primary Key (PK) to Foreign Key (FK) 1:N Relationship</text>
    <text class="text-label" x="830" y="24">CompTIA Tech+ (FC0-U71) Objective 5.1/5.3</text>

    <!-- Parent Table: CUSTOMERS (x=20, width=515) -->
    <g transform="translate(20, 38)">
      <rect width="515" height="275" class="inner-card" stroke="#0284c7" />
      <rect x="12" y="10" width="220" height="22" rx="4" fill="#0c2340" />
      <text x="122" y="25" class="badge-text" fill="#38bdf8">PARENT TABLE: CUSTOMERS</text>
      <text x="245" y="25" class="text-label" fill="#93c5fd">Holds unique master entities</text>

      <!-- Table Header -->
      <g transform="translate(12, 40)">
        <rect width="491" height="26" rx="4" fill="#1e293b" />
        <text x="12" y="17" class="text-val-mono" font-weight="700" fill="#f8fafc">customer_id [PK]</text>
        <text x="155" y="17" class="text-val-mono" font-weight="700" fill="#cbd5e1">full_name</text>
        <text x="310" y="17" class="text-val-mono" font-weight="700" fill="#cbd5e1">email</text>

        <!-- Row 1 -->
        <rect x="0" y="28" width="491" height="24" fill="#070b14" />
        <text x="12" y="44" class="text-val-mono" font-weight="700" fill="#38bdf8">101</text>
        <text x="155" y="44" class="text-val-mono" fill="#e2e8f0">Alice Vance</text>
        <text x="310" y="44" class="text-val-mono" fill="#94a3b8">alice@beattie.local</text>

        <!-- Row 2 -->
        <rect x="0" y="54" width="491" height="24" fill="#0d1527" />
        <text x="12" y="70" class="text-val-mono" font-weight="700" fill="#38bdf8">102</text>
        <text x="155" y="70" class="text-val-mono" fill="#e2e8f0">Bob Chen</text>
        <text x="310" y="70" class="text-val-mono" fill="#94a3b8">bob@beattie.local</text>

        <!-- Row 3 -->
        <rect x="0" y="80" width="491" height="24" fill="#070b14" />
        <text x="12" y="96" class="text-val-mono" font-weight="700" fill="#38bdf8">103</text>
        <text x="155" y="96" class="text-val-mono" fill="#e2e8f0">Carlos Mendez</text>
        <text x="310" y="96" class="text-val-mono" fill="#94a3b8">carlos@beattie.local</text>
      </g>

      <!-- Key Callout -->
      <rect x="12" y="155" width="491" height="108" rx="4" fill="#070b14" stroke="#1e293b" />
      <text x="22" y="176" class="text-val-mono" font-size="11px" font-weight="700" fill="#38bdf8">Primary Key (PK) Rules:</text>
      <text x="22" y="196" class="text-label" fill="#cbd5e1">• Uniquely identifies each individual row in this table.</text>
      <text x="22" y="214" class="text-label" fill="#cbd5e1">• Must contain a unique value; CANNOT contain NULL.</text>
      <text x="22" y="232" class="text-label" fill="#cbd5e1">• Indexed automatically via B-Tree for instant O(log N) lookup.</text>
      <text x="22" y="250" class="text-label" fill="#38bdf8">Cardinality: [ 1 ] — One customer can place many orders.</text>
    </g>

    <!-- Connector Indicator -->
    <g transform="translate(540, 95)">
      <path d="M 0 45 L 30 45" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="4,3" />
      <circle cx="15" cy="45" r="14" fill="#0c2340" stroke="#f59e0b" stroke-width="1.5" />
      <text x="15" y="49" class="badge-text" fill="#fcd34d" font-size="9px">1:N</text>
    </g>

    <!-- Child Table: ORDERS (x=575, width=515) -->
    <g transform="translate(575, 38)">
      <rect width="515" height="275" class="inner-card" stroke="#f59e0b" />
      <rect x="12" y="10" width="200" height="22" rx="4" fill="#451a03" />
      <text x="112" y="25" class="badge-text" fill="#fcd34d">CHILD TABLE: ORDERS</text>
      <text x="225" y="25" class="text-label" fill="#fde68a">References parent via FK</text>

      <!-- Table Header -->
      <g transform="translate(12, 40)">
        <rect width="491" height="26" rx="4" fill="#1e293b" />
        <text x="12" y="17" class="text-val-mono" font-weight="700" fill="#f8fafc">order_id [PK]</text>
        <text x="130" y="17" class="text-val-mono" font-weight="700" fill="#f59e0b">cust_id [FK]</text>
        <text x="250" y="17" class="text-val-mono" font-weight="700" fill="#cbd5e1">order_total</text>
        <text x="375" y="17" class="text-val-mono" font-weight="700" fill="#cbd5e1">status</text>

        <!-- Row 1 -->
        <rect x="0" y="28" width="491" height="24" fill="#070b14" />
        <text x="12" y="44" class="text-val-mono" fill="#cbd5e1">5001</text>
        <text x="130" y="44" class="text-val-mono" font-weight="700" fill="#f59e0b">101</text>
        <text x="250" y="44" class="text-val-mono" fill="#e2e8f0">$340.00</text>
        <text x="375" y="44" class="text-val-mono" fill="#10b981">DELIVERED</text>

        <!-- Row 2 -->
        <rect x="0" y="54" width="491" height="24" fill="#0d1527" />
        <text x="12" y="70" class="text-val-mono" fill="#cbd5e1">5002</text>
        <text x="130" y="70" class="text-val-mono" font-weight="700" fill="#f59e0b">101</text>
        <text x="250" y="70" class="text-val-mono" fill="#e2e8f0">$85.50</text>
        <text x="375" y="70" class="text-val-mono" fill="#38bdf8">SHIPPED</text>

        <!-- Row 3 -->
        <rect x="0" y="80" width="491" height="24" fill="#070b14" />
        <text x="12" y="96" class="text-val-mono" fill="#cbd5e1">5003</text>
        <text x="130" y="96" class="text-val-mono" font-weight="700" fill="#f59e0b">102</text>
        <text x="250" y="96" class="text-val-mono" fill="#e2e8f0">$1,220.00</text>
        <text x="375" y="96" class="text-val-mono" fill="#f59e0b">PENDING</text>
      </g>

      <!-- Key Callout -->
      <rect x="12" y="155" width="491" height="108" rx="4" fill="#070b14" stroke="#1e293b" />
      <text x="22" y="176" class="text-val-mono" font-size="11px" font-weight="700" fill="#fcd34d">Foreign Key (FK) &amp; Integrity Rules:</text>
      <text x="22" y="196" class="text-label" fill="#cbd5e1">• References the PK of the parent table to link tables together.</text>
      <text x="22" y="214" class="text-label" fill="#cbd5e1">• Referential Integrity: Cannot insert an order with non-existent cust_id.</text>
      <text x="22" y="232" class="text-label" fill="#cbd5e1">• Duplicate values permitted (Customer 101 has orders 5001 &amp; 5002).</text>
      <text x="22" y="250" class="text-label" fill="#fcd34d">Cardinality: [ ∞ ] — Many child orders belong to one customer.</text>
    </g>
  </g>

  <!-- Bottom Panel: SQL CRUD Matrix & Integrity Engine (x=45, y=460, width=1110, height=255) -->
  <g transform="translate(45, 460)">
    <rect width="1110" height="255" class="card-bg" stroke="#10b981" />
    <text class="text-section" x="20" y="24" fill="#34d399">2. Standard SQL Query Operations (CRUD Matrix) &amp; Index Engine</text>
    <text class="text-label" x="800" y="24">Declarative Structured Query Language</text>

    <!-- Left Box: CRUD SQL Statements (x=20, width=670) -->
    <g transform="translate(20, 36)">
      <rect width="670" height="205" class="inner-card" stroke="#059669" />

      <!-- Row 1: SELECT (Read) -->
      <rect x="12" y="10" width="70" height="20" rx="3" fill="#0284c7" />
      <text x="47" y="24" class="badge-text" fill="#ffffff">READ</text>
      <text x="92" y="24" class="text-val-mono" font-size="11px" fill="#38bdf8">SELECT o.order_id, c.full_name FROM Orders o JOIN Customers c ON o.cust_id = c.customer_id;</text>

      <!-- Row 2: INSERT (Create) -->
      <rect x="12" y="38" width="70" height="20" rx="3" fill="#059669" />
      <text x="47" y="52" class="badge-text" fill="#ffffff">CREATE</text>
      <text x="92" y="52" class="text-val-mono" font-size="11px" fill="#34d399">INSERT INTO Customers (full_name, email) VALUES ('Dana Scully', 'dana@beattie.local');</text>

      <!-- Row 3: UPDATE (Update) -->
      <rect x="12" y="66" width="70" height="20" rx="3" fill="#d97706" />
      <text x="47" y="80" class="badge-text" fill="#ffffff">UPDATE</text>
      <text x="92" y="80" class="text-val-mono" font-size="11px" fill="#fcd34d">UPDATE Orders SET status = 'DELIVERED' WHERE order_id = 5003;</text>

      <!-- Row 4: DELETE (Delete) -->
      <rect x="12" y="94" width="70" height="20" rx="3" fill="#dc2626" />
      <text x="47" y="108" class="badge-text" fill="#ffffff">DELETE</text>
      <text x="92" y="108" class="text-val-mono" font-size="11px" fill="#f87171">DELETE FROM Orders WHERE order_id = 5002;  <tspan fill="#fca5a5">-- ALWAYS use WHERE clause!</tspan></text>

      <!-- SQL Warning Footer -->
      <rect x="12" y="126" width="646" height="66" rx="4" fill="#070b14" stroke="#1e293b" />
      <text x="22" y="146" class="text-val-mono" font-size="11px" font-weight="700" fill="#f87171">Technician Warning: The Dangerous Unfiltered Query</text>
      <text x="22" y="164" class="text-label" font-size="11px" fill="#cbd5e1">Running <tspan font-family="monospace" fill="#f87171">UPDATE Orders SET status = 'CANCELLED'</tspan> without a <tspan font-family="monospace" fill="#38bdf8">WHERE</tspan> clause will</text>
      <text x="22" y="180" class="text-label" font-size="11px" fill="#cbd5e1">overwrite every single row in the entire enterprise table! Always verify filters first.</text>
    </g>

    <!-- Right Box: Index & ACID Rules (x=705, width=385) -->
    <g transform="translate(705, 36)">
      <rect width="385" height="205" class="inner-card" stroke="#1e293b" />
      <rect x="12" y="10" width="180" height="22" rx="4" fill="#1e293b" />
      <text x="102" y="25" class="badge-text" fill="#94a3b8">B-TREE INDEX &amp; ACID</text>

      <text x="14" y="52" class="text-val-mono" font-size="11px" font-weight="700" fill="#38bdf8">B-Tree Index Performance:</text>
      <text x="14" y="70" class="text-label" font-size="11px" fill="#cbd5e1">• Indexed columns allow direct O(log N) lookup.</text>
      <text x="14" y="86" class="text-label" font-size="11px" fill="#cbd5e1">• Unindexed columns trigger a full table scan</text>
      <text x="14" y="102" class="text-label" font-size="11px" fill="#fca5a5">  (reads every single record on disk).</text>

      <rect x="12" y="115" width="361" height="78" rx="4" fill="#070b14" stroke="#1e293b" />
      <text x="20" y="134" class="text-val-mono" font-size="11px" font-weight="700" fill="#34d399">ACID Compliance Guarantees:</text>
      <text x="20" y="152" class="text-label" font-size="10px" fill="#cbd5e1"><tspan font-weight="700" fill="#38bdf8">A</tspan>tomicity: All statements succeed or all roll back.</text>
      <text x="20" y="168" class="text-label" font-size="10px" fill="#cbd5e1"><tspan font-weight="700" fill="#38bdf8">C</tspan>onsistency | <tspan font-weight="700" fill="#38bdf8">I</tspan>solation | <tspan font-weight="700" fill="#38bdf8">D</tspan>urability (committed to disk).</text>
      <text x="20" y="184" class="text-label" font-size="10px" fill="#94a3b8">Guarantees data integrity during power failures.</text>
    </g>
  </g>
</svg>
